<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理健康工作政策文件题库 · 广东省中小学心理教师专业能力大赛</title>
<style>
:root{
  --bg:#F4F1EA;--paper:#FCFBF7;--ink:#262B33;--sub:#5B6472;
  --navy:#23406B;--navy2:#3A5B8C;--navy-soft:#E7EDF6;
  --green:#2E6B4F;--green-soft:#E3EFE8;
  --red:#A8433A;--red-soft:#F7E5E2;
  --amber:#A96E1C;--amber-soft:#F6EAD6;
  --teal:#2E6A70;--teal-soft:#E0EEEF;
  --line:#D9D2C4;--line2:#E6E1D6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;line-height:1.65;font-size:15px}
.wrap{max-width:900px;margin:0 auto;padding:26px 18px 60px}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#F2F5FA;border-radius:14px;padding:26px 30px 20px}
.kicker{font-size:12.5px;letter-spacing:.22em;color:#C9D6EA;margin-bottom:8px}
h1{font-size:22px;font-weight:800;line-height:1.45}
h1 .accent{color:#E9B96A}
.subtitle{margin-top:8px;font-size:13px;color:#D5DFEE;line-height:1.8}
.statbar{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 16px;margin-top:16px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:5px}
.stat b{font-size:19px;color:var(--navy)}
.stat span{font-size:12px;color:var(--sub)}
.progress{flex:1;min-width:130px;height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--navy2);border-radius:99px;transition:width .3s}
.barBtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.barBtns button{background:#fff;border:1px solid var(--line);color:var(--navy);font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
.barBtns button:hover{background:var(--navy-soft)}
.tool{display:flex;align-items:center;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.mode-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.mode-seg button{border:none;background:transparent;padding:7px 15px;font-size:13px;cursor:pointer;color:var(--sub);font-family:inherit}
.mode-seg button.on{background:var(--navy);color:#fff}
.type-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.type-seg button{border:none;background:transparent;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--sub);font-family:inherit}
.type-seg button.on{background:var(--amber);color:#fff}
.file-nav{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.file-nav button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit}
.file-nav button:hover{border-color:var(--navy2);color:var(--navy)}
.file-nav button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sel-wrap{position:relative;display:inline-block;min-width:330px;max-width:100%;margin:0 0 2px}
.sel-btn{width:100%;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;color:var(--navy);cursor:pointer;font-family:inherit;text-align:left}
.sel-btn:hover{border-color:var(--navy2)}
.sel-btn .arrow{font-size:11px;color:var(--sub)}
.sel-group{font-size:12px;color:var(--sub);padding:7px 10px 3px;font-weight:700;border-top:1px solid var(--line2);margin-top:4px}
.sel-panel{display:none;position:absolute;left:0;top:calc(100% + 4px);min-width:360px;max-width:100%;max-height:300px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 22px rgba(38,43,51,.14);z-index:60;padding:8px}
.sel-panel.show{display:block}
.sel-tool{display:flex;gap:8px;border-bottom:1px solid var(--line2);padding:2px 2px 8px;margin-bottom:6px}
.sel-tool button{background:var(--navy-soft);border:1px solid var(--line);color:var(--navy);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.sel-tool button:hover{background:var(--navy);color:#fff}
.sel-list{display:flex;flex-direction:column;gap:1px}
.sel-list label{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;line-height:1.5}
.sel-list label:hover{background:var(--navy-soft)}
.sel-list input{accent-color:var(--navy);flex:0 0 auto;margin-top:3px}
.sel-summary{margin:0 0 8px;font-size:12.5px;color:var(--sub);line-height:1.8;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:7px 10px}

.hint-line{font-size:12.5px;color:#98A0AC;margin:2px 0 12px}
.q-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:14px}
.q-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-no{font-weight:800;color:var(--navy);font-size:14.5px}
.q-doc{font-size:11.5px;color:#fff;background:var(--navy2);border-radius:5px;padding:1px 8px}
.badge{font-size:11.5px;color:#fff;border-radius:5px;padding:1px 8px}
.badge.s{background:var(--amber)}
.badge.m{background:var(--teal)}
.q-text{font-size:15.5px;font-weight:600;margin-top:10px;line-height:1.8}
.opts{margin-top:13px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1.5px solid var(--line2);border-radius:10px;padding:9px 12px;cursor:pointer;transition:all .15s;background:#fff}
.opt .k{font-weight:800;color:var(--navy);flex:0 0 auto;width:20px}
.opt.sel{border-color:var(--navy2);background:var(--navy-soft)}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--line2);background:#fff}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .k{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{color:var(--red)}
.opt .mark{margin-left:auto;font-weight:800;flex:0 0 auto}
.submitRow{margin-top:13px}
.submitRow button,.navBtns button,.wrongList button{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:9px 24px;font-size:14px;cursor:pointer;font-family:inherit}
.submitRow button:hover{background:var(--navy2)}
.navBtns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.navBtns button{background:#fff;border:1.5px solid var(--navy);color:var(--navy);padding:8px 18px}
.navBtns button.primary{background:var(--navy);color:#fff}
.reveal{display:none;margin-top:13px;border-radius:10px;padding:12px 15px;font-size:13.5px;line-height:1.9}
.reveal.show{display:block}
.reveal.correct{background:var(--green-soft);border:1px solid #BCD6C6;color:#1F4A34}
.reveal.incorrect{background:var(--red-soft);border:1px solid #E4C3BD;color:#6E2A22}
.reveal.review{background:var(--navy-soft);border:1px solid #C4D2E6;color:var(--ink)}
.reveal b{font-weight:800}
.reveal .ans{font-weight:800;color:var(--navy)}
.summary{display:none;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin:4px 0 16px}
.summary.show{display:block}
.summary h2{font-size:19px;color:var(--navy);margin-bottom:10px}
.score-big{font-size:40px;font-weight:800;color:var(--navy)}
.summary .stats{display:flex;gap:24px;margin-top:6px;flex-wrap:wrap}
.summary .stats div{font-size:13.5px;color:var(--sub)}
.summary .stats b{font-size:17px;color:var(--ink)}
.wrongList{margin-top:14px;list-style:none}
.wrongList li{padding:7px 0;border-bottom:1px dashed var(--line2);font-size:13px;cursor:pointer}
.wrongList li:hover{color:var(--navy)}
.empty{padding:30px;text-align:center;color:var(--sub);background:var(--paper);border:1px dashed var(--line);border-radius:12px}
footer{margin-top:26px;text-align:center;font-size:12px;color:#98A0AC;line-height:1.9}
@media (max-width:640px){
  .wrap{padding:14px 10px 46px}
  header{padding:18px 16px}
  h1{font-size:18px}
  .q-card{padding:15px 14px}
}

.wrong-panel p{margin-top:8px;font-size:13px;color:var(--sub);line-height:1.8}
.wrong-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.wrong-actions button{background:#fff;border:1.5px solid var(--navy);color:var(--navy);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.wrong-actions button.primary{background:var(--navy);color:#fff}
.wrong-actions button.danger{border-color:var(--red);color:var(--red)}
.wrong-empty{padding:26px;text-align:center;color:var(--sub);background:var(--paper);border:1px dashed var(--line);border-radius:12px;margin-top:6px}
.resume-banner{background:var(--navy-soft);border:1px solid #C4D2E6;border-radius:10px;padding:10px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink)}
.resume-banner button{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.progress-panel p{margin-top:8px;font-size:13px;color:var(--sub);line-height:1.8}
.range-row{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff}
.range-main{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.range-main b{color:var(--navy);font-size:14px}
.range-main span{font-size:12px;color:var(--sub);background:var(--navy-soft);border-radius:5px;padding:1px 7px}
.range-meta{margin-top:5px;font-size:12.5px;color:var(--sub)}
.range-actions{display:flex;gap:8px;margin-top:8px}
.range-actions button{background:#fff;border:1.5px solid var(--navy);color:var(--navy);border-radius:7px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.range-actions button[data-delete]{border-color:var(--red);color:var(--red)}
.modal-overlay{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px 22px;box-shadow:0 16px 40px rgba(20,25,35,.25);line-height:1.8}
.modal h3{font-size:17px;color:var(--navy);margin-bottom:8px}
.modal-body p{margin:6px 0}
.modal-choice{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:13.5px;cursor:pointer}
.modal-choice input{margin-top:5px;accent-color:var(--navy)}
.modal-warn,.modal-note{font-size:12.5px;color:var(--sub);background:var(--amber-soft);border:1px solid #EAD6B5;border-radius:8px;padding:8px 10px;margin-top:8px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal-actions button{background:#fff;border:1.5px solid var(--navy);color:var(--navy);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.modal-actions button.primary{background:var(--navy);color:#fff}
.modal-actions button.danger{border-color:var(--red);color:var(--red)}


@media print{
  body{background:#fff;font-size:12.5px}
  .wrap{max-width:none;padding:0}
  header{border-radius:0;padding:14px 4px;background:#fff;color:#000;border-bottom:1px solid #000}
  header .kicker,header .subtitle{color:#333}
  .statbar,.tool,.submitRow,.navBtns,.barBtns,.hint-line,.summary,.wrongList,.sel-wrap,.sel-summary,.wrong-panel,.wrong-actions,.progress-panel,.resume-banner{display:none!important}
  .q-card{break-inside:avoid;padding:10px 4px;border:none;border-bottom:1px solid #ccc;border-radius:0;margin-bottom:8px}
  .opt{border:1px solid #bbb;cursor:default;padding:4px 8px;page-break-inside:avoid}
  .opt.right{border-color:var(--green);background:var(--green-soft)}
  .opt.sel{border-color:#bbb;background:#fff}
  .reveal{display:block!important;background:var(--navy-soft);border:1px solid #C4D2E6;color:var(--ink)}
  .reveal .mark,.mark{display:none}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}

.exam-bar{display:flex;align-items:center;gap:12px;background:var(--navy);color:#F2F5FA;border-radius:12px;padding:11px 16px;margin-bottom:12px;flex-wrap:wrap}
.exam-bar .exname{font-weight:700;font-size:14px}
.exam-bar .exclock{margin-left:auto;font-size:20px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.exam-bar .exclock.warn{color:#FFD166}
.exam-bar .exclock.danger{color:#FF8A80}
.exam-bar .exdone{font-size:12.5px;color:#C9D6EA}
.exam-nav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.exam-nav button{flex:1;min-width:84px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit}
.exam-nav button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.exam-nav button:disabled{opacity:.4;cursor:default}
.exam-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.exam-pick button{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:16px 14px;text-align:left;cursor:pointer;font-family:inherit}
.exam-pick button:hover{border-color:var(--navy2);background:var(--navy-soft)}
.exam-pick b{display:block;font-size:15px;color:var(--navy)}
.exam-pick span{display:block;font-size:12px;color:var(--sub);margin-top:3px}
.exm-mask{position:fixed;inset:0;background:rgba(20,26,36,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:18px}
.exm-box{background:var(--paper);border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:84vh;overflow:auto}
.exm-box h3{font-size:16px;margin-bottom:10px}
.exm-box p{font-size:13.5px;color:var(--sub);line-height:1.8;margin-bottom:12px}
.exm-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.exm-cell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit;padding:0}
.exm-cell.done{background:var(--navy-soft);border-color:var(--navy2);color:var(--navy);font-weight:700}
.exm-cell.cur{outline:2px solid var(--navy);outline-offset:1px}
.exm-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.exm-acts button{flex:1;min-width:96px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit}
.exm-acts button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.exm-toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(20,26,36,.9);color:#fff;padding:10px 18px;border-radius:9px;font-size:13.5px;z-index:1000}
.exm-score{display:flex;align-items:baseline;gap:10px;justify-content:center;padding:8px 0 4px}
.exm-score b{font-size:40px;color:var(--navy);line-height:1}
.exm-score span{font-size:13px;color:var(--sub)}
.exm-kpis{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:13.5px;color:var(--sub);margin-top:8px}
.exm-kpis b{color:var(--ink)}

.exm-cell.multi{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.exm-cell.multi.done{background:var(--teal);border-color:var(--teal);color:#fff}
.exm-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-bottom:10px}
.exm-legend i{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid var(--line);background:#fff;vertical-align:-2px;margin-right:5px}
.exm-legend i.done{background:var(--navy-soft);border-color:var(--navy2)}
.exm-legend i.multi{background:var(--teal-soft);border-color:var(--teal)}
</style>

<body>
<div class="wrap">
<header>
  <div class="kicker">广东省中小学心理教师专业能力大赛</div>
  <h1>心理健康工作政策文件题库 · 备考练习<br></h1>
  <div class="subtitle">客观题在线练习：单选、多选分题型标注；作答即判并显示解析与原文出处。可整卷浏览/打印带答案版，错题一键回顾。本页为本地单文件；学习进度与错题本会自动保存在本机浏览器中。</div>
</header>

<div class="statbar">
  <div class="stat"><b id="sDone">0</b><span>已答</span></div>
  <div class="stat"><b id="sRight">0</b><span>答对</span></div>
  <div class="stat"><b id="sWrong">0</b><span>答错</span></div>

  <div class="barBtns"><button id="btnPrint">呈现当前范围答案版</button><button id="btnWrongBook">错题本（0）</button><button id="btnReset">重新开始</button></div>
</div>

<div class="tool">
  <div class="mode-seg">
    <button id="mPractice" class="on">逐题练习</button>
    <button id="mReview">整卷浏览</button><button id="mWrong">错题本（0）</button>
  </div>
  <div class="type-seg">
    <button data-type="all" class="on">全部</button>
    <button data-type="single">单选</button>
    <button data-type="multi">多选</button>
  </div>
</div>

<div class="sel-wrap" id="selBox">
  <button type="button" id="selBtn" class="sel-btn"><span id="selBtnText">文件卷筛选</span><span class="arrow">&#9662;</span></button>
  <div class="sel-panel" id="selPanel">
    <div class="sel-tool"><button type="button" id="selAll">全选</button><button type="button" id="selClear">清空</button></div>
    <div class="sel-list" id="selList"></div>
  </div>
</div>
<div class="sel-summary" id="selSummary">当前选择：全部 15 卷。</div>

<div class="hint-line" id="hintLine"></div>

<footer>题库依据 15 份心理健康政策文件整理；需求发起人：蔡柔娜老师；题库提供者：冯馨怡/梁明意/刘贵华/林轩蕴/曾烨雯/周琳/周秦诺（以姓名拼音顺序排序）。</footer>

<script>

,"q":"下列哪类学生属于文件规定需要重点关注的学生？","o":["所有成绩优秀学生","心理健康测评中发现有自杀倾向的学生","所有学生干部","所有体育特长生"],"a":"B","x":"补充解析：重点关注对象包括心理健康测评中发现有心理障碍、心理疾病或自杀倾向的学生等。（原文出处：指引“一（二）1、静态普查流程与要点”）"},{"f":"7","t":"single","q":"下列哪一类学生属于重点关注对象？","o":["即将参加高考的毕业班学生","所有初一新生","所有转学生","所有独生子女"],"a":"A","x":"补充解析：即将高考的毕业班学生属于文件列举的重点关注对象。（原文出处：指引“一（二）1、静态普查流程与要点”）"},{"f":"7","t":"single","q":"社会支持系统缺乏或丧失的学生属于（ ）。","o":["无需关注对象","重点关注对象","只需家长关注对象","只需医务人员关注对象"],"a":"B","x":"补充解析：社会支持系统缺乏或丧失的学生属于重点关注对象。（原文出处：指引“一（二）1、静态普查流程与要点”）"},{"f":"7","t":"single","q":"情绪控制力差且有冲动行为的学生（ ）。","o":["属于重点关注学生","不属于心理危机排查范围","只进行学业辅导","必须直接确定为三级预警"],"a":"A","x":"补充解析：情绪控制力差、有冲动行为的学生属于重点关注学生。（原文出处：指引“一（二）1、静态普查流程与要点”）"},{"f":"7","t":"single","q":"正在服用精神类药物控制病情的学生属于（ ）。","o":["重点关注对象","普通关注对象","无须进入学校心理排查","必然为一级预警"],"a":"A","x":"补充解析：正在服用精神类药物控制病情的学生属于重点关注对象。（原文出处：指引“一（二）1、静态普查流程与要点”）"},{"f":"7","t":"single","q":"经专业医院诊断曾因心理疾病休学、病情好转后复学的学生（ ）。","o":["不再需要关注","属于重点关注学生","只需班主任关注","不得复学"],"a":"B","x":"补充解析：经专业医院诊断曾因心理疾病休学、病情好转后复学的学生属于重点关注对象。（原文出处：指引“一（二）1、静态普查流程与要点”）"},{"f":"7","t":"single","q":"动态观察主要通过（ ）获取学生心理健康状况信息。","o":["一次心理测验","多种渠道反馈","统一医疗检查","学业成绩排名"],"a":"B","x":"补充解析：动态观察通过班主任、学科教师、心理老师、学生、家长等各种渠道的反馈收集学生心理健康状况信息。（原文出处：指引“一（一）2、动态观察”）"},{"f":"7","t":"single","q":"与学生接触最频繁的教师群体尤其是（ ）。","o":["心理委员","班主任","校长","校医"],"a":"B","x":"补充解析：各学科教师尤其是班主任与学生接触最频繁，可及时发现学生的异常心理与行为。（原文出处：指引“一（一）2、动态观察”）"},{"f":"7","t":"single","q":"文件将（ ）称为学生心理危机预警和识别的中坚力量。","o":["学生干部","家长","心理教师","学科教师"],"a":"C","x":"补充解析：心理教师是学生心理危机预警和识别的中坚力量。（原文出处：指引“一（一）2、动态观察”）"},{"f":"7","t":"single","q":"学生干部群体在动态观察中的优势主要是（ ）。","o":["可以进行专业诊断","较方便对同班同学进行观察和关注","可以直接确定危机等级","可以开具诊断证明"],"a":"B","x":"补充解析：学生特别是学生干部群体比较方便对同班同学进行心理的观察和关注，能帮助老师及时发现异常。（原文出处：指引“一（一）2、动态观察”）"},{"f":"7","t":"single","q":"学生家长、生活老师、校医等尤其可以观察学生哪些方面的变化？","o":["仅学习成绩","生理、睡眠、饮食等症状和行为","仅课堂纪律","仅同伴评价"],"a":"B","x":"补充解析：学生家长、生活老师、校医等可以观察到学生日常生活如生理、睡眠、饮食等症状和行为的异常变化。（原文出处：指引“一（一）2、动态观察”）"},{"f":"7","t":"single","q":"除面对面观察外，文件还建议通过网络重点关注（ ）。","o":["学生群、朋友圈、QQ空间等","教师购物记录","家长银行账户","学生成绩系统"],"a":"A","x":"补充解析：除面对面观察外，还可通过网络途径重点关注学生群、学生朋友圈、QQ空间等。（原文出处：指引“一（一）2、动态观察”）"},{"f":"7","t":"single","q":"文件提到可通过设立学生心理热线、心理信箱和（ ）帮助了解学生心理动态。","o":["体育馆","宣泄室","医疗病房","考务办公室"],"a":"B","x":"补充解析：可通过设立学生心理热线、心理信箱、宣泄室等形式引导学生宣泄负面情绪、倾诉烦恼。（原文出处：指引“一（一）2、动态观察”）"},{"f":"7","t":"single","q":"建议初、高中学校设立（ ）。","o":["班级心理委员","学生诊断员","班级治疗师","家庭治疗小组"],"a":"A","x":"补充解析：建议各初、高中学校设立班级心理委员，并进行系统培训。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"动态心理排查中，心理委员应接受（ ）。","o":["医疗资格培训","系统培训","司法培训","无需培训"],"a":"B","x":"补充解析：班级心理委员应接受系统培训，以便帮助班主任及时发现同学异常现象并反馈。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"动态心理危机信息的主要来源者是（ ）。","o":["校长","班主任","家长委员会","校外医生"],"a":"B","x":"补充解析：班主任是学生心理危机动态信息的主要来源者。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"班主任应将需要危机识别和预警的学生信息填写到（ ）。","o":["学生综合素质评价表","学生心理危机预警登记表","医疗诊断书","心理咨询结案表"],"a":"B","x":"补充解析：班主任应根据普查结果等，将需要危机识别和预警的学生相关信息填入学生心理危机预警登记表。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"学生心理危机预警登记表应上报（ ）。","o":["班级心理委员","学校心理辅导中心","学生会","所有家长"],"a":"B","x":"补充解析：学生心理危机预警登记表应上报学校心理辅导中心，便于下一步的分级评估。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"各类人员定期上报动态观察情况，文件建议的频率是（ ）。","o":["每周一次","一月一次","每学期一次","每年一次"],"a":"B","x":"补充解析：各类人员需明确职责，定期上报（建议一月一次）。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"【情境题】一名学生近期父母离异，该事件按照文件属于（ ）。","o":["心理测验结果","可能引发心理危机的生活事件","人格障碍诊断","三级预警的必然依据"],"a":"B","x":"补充解析：近期遭遇家庭变故（如父母离异、再婚、家庭成员重病事故死亡等意外）属于可能引发心理危机的生活事件。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"【情境题】学生遭受同伴排斥、嘲笑和欺凌，按照文件首先属于需要关注的（ ）。","o":["生活事件","医疗诊断","心理量表指标","家庭经济问题"],"a":"A","x":"补充解析：发生严重人际冲突，或被同伴群体排斥、嘲笑、欺凌等属于生活事件。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"【情境题】学生突然将自己非常心爱的物品送给同学，这属于文件列举的（ ）。","o":["正常成长表现","预警危险信号中的异常行为改变","家庭事件","心理测量结果"],"a":"B","x":"补充解析：将心爱之物分赠他人等突然的行为改变属于文件列举的预警危险信号中的异常行为改变。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"【情境题】学生说“活着一点意义都没有”，按照文件属于（ ）。","o":["一般学习抱怨","厌世言语","人格测验结果","家庭冲突"],"a":"B","x":"补充解析：“活着一点意义都没有”等直接或间接表达寻死、逃避或永别的言语属于厌世言语。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"【情境题】学生近期学习成绩突然明显下滑，属于文件列举的（ ）。","o":["奇怪的行为变化","心理疾病诊断","学校处分","家庭变故"],"a":"A","x":"补充解析：学习成绩突然下滑属于文件列举的“奇怪的行为”等预警危险信号。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"【情境题】学生开始出现自伤自残行为，这属于（ ）。","o":["动态观察中的预警危险信号","一般学业问题","普通青春期现象","单纯家庭问题"],"a":"A","x":"补充解析：开始自伤自残或从事高危活动属于预警危险信号中的异常行为改变。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"下列哪一种属于文件列举的消极情绪表现？","o":["悲观","兴奋","好奇","自豪"],"a":"A","x":"补充解析：文件列举的消极情绪包括悲观、抑郁、焦躁不安、无价值感、异常强烈而无法宣泄的愤怒或仇恨等。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"single","q":"心理危机分级评估是心理危机筛查工作的（ ）。","o":["可有可无环节","必要环节","医疗诊断环节","最后一个行政环节"],"a":"B","x":"补充解析：心理危机分级评估是心理危机筛查工作的必要环节。（原文出处：指引“二、中小学心理危机分级评估”）"},{"f":"7","t":"single","q":"心理危机评估小组一般不包括下列哪一人员？","o":["学校分管领导","心理专（兼）职教师","相关班主任","全体学生家长"],"a":"D","x":"补充解析：评估小组人员由学校分管领导、心理专（兼）职教师及相关班主任组成，不包括全体学生家长。（原文出处：指引“二、中小学心理危机分级评估”）"},{"f":"7","t":"single","q":"心理危机分级评估一般由（ ）完成。","o":["医院","学校自己","公安机关","家长委员会"],"a":"B","x":"补充解析：危机评估一般由学校自己完成。（原文出处：指引“二、中小学心理危机分级评估”）"},{"f":"7","t":"single","q":"开展危机等级评估时，应综合（ ）。","o":["仅心理测验分数","静态与动态信息","仅学习成绩","仅家长意见"],"a":"B","x":"补充解析：评估应综合心理健康状态排查的静态与动态信息。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"对预警学生进一步评估通常需要（ ）。","o":["访谈与心理测评","仅重新考试","仅家访","仅体检"],"a":"A","x":"补充解析：对预警学生应进行进一步访谈与心理测评，结合面谈与测评结果进行危机等级评估。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"危机评估小组定期评估工作的建议频率为（ ）。","o":["每月一次","每学期一次","每周一次","每年一次"],"a":"B","x":"补充解析：危机评估小组定期开展评估工作，建议每学期一次，可视具体情况增加次数。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"负责召集评估小组成员，并进行行政指导和监督的是（ ）。","o":["班主任","学校分管领导","心理委员","学生家长"],"a":"B","x":"补充解析：学校分管领导负责召集评估小组成员，进行行政指导和监督。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"在评估阶段，负责整理学生日常观察反馈重要信息的是（ ）。","o":["班主任","校医","心理委员","校长"],"a":"A","x":"补充解析：班主任负责整理记录对学生日常观察反馈得到的重要信息，并与心理专（兼）职教师进行信息整合。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"负责对相关学生进一步测试和面谈的是（ ）。","o":["学科教师","心理专（兼）职教师","学生干部","生活老师"],"a":"B","x":"补充解析：心理专（兼）职教师负责对相关学生进行进一步的测试和面谈。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"心理专（兼）职教师在评估阶段还需要（ ）。","o":["确定危机等级并作出评估报告","直接进行精神疾病诊断","替家长作出住院决定","公开学生信息"],"a":"A","x":"补充解析：心理专（兼）职教师负责补充完善预警登记表、确定危机等级并做出评估报告。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"下列哪类学生应进入评估阶段？","o":["心理问卷测量得分高的学生","仅成绩下降但没有任何其他信息的所有学生","所有一年级学生","所有班干部"],"a":"A","x":"补充解析：进入评估阶段的学生包括心理问卷测量得分高的学生。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"心理普查中发现需要重点关注的学生（ ）。","o":["应进入评估阶段","一律直接转介医院","不再需要进一步评估","只进行学习辅导"],"a":"A","x":"补充解析：心理普查中发现需要重点关注的学生应进入评估阶段。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"【情境题】某学生心理问卷得分不高，但班主任、同学连续观察到明显异常和危机迹象。按照文件，该生（ ）。","o":["因问卷得分低，不进入评估","可以进入心理危机评估阶段","必须等下一年度普查","只需要由家长处理"],"a":"B","x":"补充解析：心理问卷得分低但通过动态观察觉得可能出现心理危机的学生，也可进入评估阶段。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"single","q":"对进入预警评估阶段的学生，文件建议可先选用（ ）等筛查手段。","o":["PHQ-9","16PF作为唯一工具","智力测验","职业兴趣量表"],"a":"A","x":"补充解析：对进入预警评估阶段的学生，建议先使用灵活、科学的心理筛查手段（可选择PHQ-9抑郁症筛查量表等）。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"single","q":"面谈中需要核实心理普查以及（ ）获得的信息。","o":["班主任及其他人员观察","学生考试排名","体育比赛","网络公开评价"],"a":"A","x":"补充解析：面谈中要核实心理普查与班主任及其他人员观察获得的信息，搜集更多学生信息。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"single","q":"最终危机等级通常通过（ ）确定。","o":["单一教师决定","评估小组联合会诊","学生本人决定","家长单方面决定"],"a":"B","x":"补充解析：评估小组进行联合会诊，确定学生危机等级并撰写评估报告。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"single","q":"【情境题】学生的心理危机程度已严重超出学校心理工作者专业水平，此时学校应（ ）。","o":["强行独立完成","借助校外专业机构协助评估并转介","暂停处理","仅由班主任观察"],"a":"B","x":"补充解析：当危机程度严重超出学校心理工作者专业水平时，应借助校外专业机构协助评估并进行转介。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"single","q":"文件举例需要校外专业机构协助评估的严重心理障碍不包括（ ）。","o":["抑郁症","焦虑症","双相情感障碍","普通考试紧张"],"a":"D","x":"补充解析：需借助校外专业机构的严重心理障碍包括抑郁症、焦虑症、双相情感障碍等，普通考试紧张不属于此类。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"single","q":"疑似精神分裂症的学生（ ）。","o":["可以考虑借助校外专业机构协助评估","只能由班主任处理","无需危机评估","自动定为一级预警"],"a":"A","x":"补充解析：疑似精神分裂症的学生可借助校外专业机构协助评估。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"single","q":"不愿意在学校接受心理辅导与干预的学生和家长属于文件所列（ ）。","o":["可以考虑校外专业协助和转介的情形","直接解除预警的情形","不进入危机筛查的情形","必然属于一级预警"],"a":"A","x SCL-90适合初中生以上，EPQ儿童版适合7—15岁儿童，16PF适合初中生以上。（原文出处：指引“一（二）1、静态普查流程与要点”）"},{"f":"7","t":"multi","q":"家庭情况调查可以了解学生是否存在（ ）。","o":["早期心理创伤","单亲、离异或重组家庭","家庭经济困难","家庭关系矛盾突出"],"a":"ABCD","x":"补充解析：家庭情况调查可了解早期心理创伤、单亲离异或重组家庭、家庭经济困难、家庭关系矛盾突出等情况。（原文出处：指引“一（二）1、静态普查流程与要点”）"},{"f":"7","t":"multi","q":"下列属于文件规定重点关注对象的是（ ）。","o":["有明显性格偏差、适应不良的学生","亲子关系紧张的学生","家境贫困且自卑感强的学生","身体严重疾病且治疗周期较长的学生"],"a":"ABCD","x":"补充解析：重点关注对象包括有明显性格偏差、适应不良、亲子关系紧张、家境贫困自卑感强、身体严重疾病且治疗周期长等学生。（原文出处：指引“一（二）1、静态普查流程与要点”）"},{"f":"7","t":"multi","q":"动态心理排查网络可包括（ ）。","o":["班主任","心理委员","生活老师","寝室长"],"a":"ABCD","x":"补充解析：动态心理排查网络包括班主任、学科教师、心理委员、心理专（兼）职教师、生活老师、寝室长等。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"multi","q":"下列属于可能引发心理危机的生活事件的是（ ）。","o":["遭遇学业重大受挫","父母离异或再婚","严重人际冲突或遭受欺凌","目击恶性伤害事件"],"a":"ABCD","x":"补充解析：遭遇学业重大受挫、父母离异或再婚、严重人际冲突或遭受欺凌、目击恶性伤害事件等均属生活事件。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"multi","q":"文件列举的心理危机预警信号包括（ ）。","o":["悲观、抑郁、焦躁不安","无价值感","厌世或寻死言语","自伤、自残或从事高危活动"],"a":"ABCD","x":"补充解析：消极情绪（悲观、抑郁、焦躁不安、无价值感）、厌世或寻死言语、自伤自残或从事高危活动等均属预警信号。（原文出处：指引“一（二）2、动态观察流程与要点”）"},{"f":"7","t":"multi","q":"心理危机评估小组一般包括（ ）。","o":["学校分管领导","心理专（兼）职教师","相关班主任","全体学生干部"],"a":"ABC","x":"补充解析：危机评估小组由学校分管领导、心理专（兼）职教师及相关班主任组成，不包括全体学生干部。（原文出处：指引“二、中小学心理危机分级评估”）"},{"f":"7","t":"multi","q":"下列学生应进入心理危机评估阶段的是（ ）。","o":["心理问卷测量得分高的学生","普查中发现需要重点关注的学生","问卷得分低但动态观察显示可能存在心理危机的学生","所有心理测验得分正常的学生"],"a":"ABC","x":"补充解析：进入评估的学生包括问卷得分高、普查发现需重点关注、问卷得分低但动态观察显示可能危机三类。（原文出处：指引“二（一）启动心理危机评估工作”）"},{"f":"7","t":"multi","q":"文件列举可借助校外专业机构协助评估和转介的情形包括（ ）。","o":["疑似严重心理障碍","疑似精神分裂症","学生和家长不愿接受学校心理辅导与干预","超出学校心理工作者能力范围的个案"],"a":"ABCD","x":"补充解析：疑似严重心理障碍、疑似精神分裂症、学生和家长不愿接受校内辅导干预、超出学校心理工作者能力范围的个案，均可借助校外专业机构评估和转介。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"multi","q":"一级预警的一般特点包括（ ）。","o":["由现实因素激发","持续时间相对较短","情绪反应能在理智控制之下","情绪反应尚未泛化"],"a":"ABCD","x":"补充解析：一级预警特点为现实因素激发、持续时间较短、情绪可受理智控制、尚未泛化。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"multi","q":"二级预警的特点包括（ ）。","o":["相对强烈的现实因素激发","初始情绪反应强烈","持续时间较长","内容充分泛化"],"a":"ABCD","x":"补充解析：二级预警特点为相对强烈现实因素激发、初始情绪反应强烈、持续时间较长、内容充分泛化。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"multi","q":"下列情况属于文件正文所述三级预警重点情形的是（ ）。","o":["有既往心理疾病诊疗史","有过自伤自杀行为","情况严重且目前情况不佳","出现自杀征兆"],"a":"ABCD","x":"补充解析：有既往心理疾病诊疗史、有过自伤自杀行为、情况严重且目前情况不佳、出现自杀征兆，均属三级预警重点情形。（原文出处：指引“二（二）心理危机评估流程与分类”）"},{"f":"7","t":"multi","q":"心理危机预警库应纳入（ ）。","o":["一级预警学生","二级预警学生","三级预警学生","仅三级预警学生"],"a":"ABC","x":"补充解析：三类危机预警库应纳入经评估得出的一、二、三级预警学生名单，而非仅三级。（原文出处：指引“二（三）建立心理危机预警库”）"},{"f":"7","t":"multi","q":"三类心理危机预警库应包括（ ）。","o":["预警名单","危机档案","全校考试排名","教师绩效记录"],"a":"AB","x":"补充解析：三类危机预警库需包括预警名单和危机档案。（原文出处：指引“二（三）建立心理危机预警库”）"},{"f":"7","t":"multi","q":"危机档案可包括（ ）。","o":["学生心理危机预警登记表","评估阶段访谈记录","心理测评结果和心理评估报告","动态管理记录"],"a":"ABCD","x":"补充解析：危机档案可包括预警登记表、评估阶段访谈记录、心理测评结果与评估报告、动态管理记录等。（原文出处：指引“二（三）建立心理危机预警库”）"},{"f":"7","t":"multi","q":"文件列出的危机档案相关材料还包括（ ）。","o":["学生心理健康状况家长告知书","医院诊断书","安全责任承诺书","预警等级变动等信息"],"a":"ABCD","x":"补充解析：危机档案相关材料还包括学生心理健康状况家长告知书、医院诊断书、安全责任承诺书、预警等级变动信息等。（原文出处：指引“二（三）建立心理危机预警库”）"},{"f":"7","t":"multi","q":"对一般预警对象，文件规定的干预措施包括（ ）。","o":["班主任给予积极关注","心理教师进行一般性的个别心理辅导","必要时寻求家长支持","定期交流干预效果并调整方案"],"a":"ABCD","x":"补充解析：一般预警干预包括班主任积极关注、心理教师一般性个别辅导、必要时寻求家长支持、定期交流效果并调整方案。（原文出处：指引“三、分类制定不同干预方案”）"},{"f":"7","t":"multi","q":"对重点预警对象，心理教师应将情况通报（ ）。","o":["班主任","学校德育处","主管校长","全体学生"],"a":"ABC","x":"补充解析：重点预警对象应通报班主任、学校德育处、主管校长，不向全体学生公开。（原文出处：指引“三、分类制定不同干预方案”）"},{"f":"7","t":"multi","q":"重点预警对象干预方案的共同制定人员包括（ ）。","o":["心理专（兼）职教师","班主任","学校德育处","家长"],"a":"ABCD","x":"补充解析：重点预警干预方案由心理专（兼）职教师协同班主任、学校德育处、家长共同制定。（原文出处：指引“三、分类制定不同干预方案”）"},{"f":"7","t":"multi","q":"对重点预警学生，家长应（ ）。","o":["尝试加强亲子沟通","给予孩子积极帮助","给予心理支持","完全把工作交给学校"],"a":"ABC","x":"补充解析：对重点预警学生，家长应尝试多进行亲子沟通，给予孩子积极帮助与心理支持。（原文出处：指引“三、分类制定不同干预方案”）"},{"f":"7","t":"multi","q":"特别预警对象联席会谈通常需要参与的人员包括（ ）。","o":["校长或分管副校长","德育处负责人","心理教师和班主任","家长"],"a":"ABCD","x":"补充解析：特别预警联席会谈通常由校长或分管副校长、德育处负责人、心理教师、班主任、家长参加。（原文出处：指引“三、分类制定不同干预方案”）"},{"f":"7","t":"multi","q":"特别预警对象的联席会谈可以共同商讨（ ）。","o":["是否进一步进行专业诊断","是否转介","是否休学","相关处理方案"],"a":"ABCD","x":"补充解析：联席会谈可商讨是否需要进一步专业诊断、是否转介、是否休学及相关处理方案。（原文出处：指引“三、分类制定不同干预方案”）"},{"f":"7","t":"multi","q":"附件1“学生心理档案”包括的内容有（ ）。","o":["个人情况","家庭情况","学习经历","重大生活事件"],"a":"ABCD","x":"补充解析：附件1“学生心理档案”包括个人情况、家庭情况、学习经历、重大生活事件等栏目。（原文出处：指引附件1“学生心理档案”）"},{"f":"7","t":"multi","q":"根据附件2，MHT包含的方面包括（ ）。","o":["学习焦虑","对人焦虑","孤独倾向","冲动倾向"],"a":"ABCD","x":"补充解析：附件2介绍MHT包含学习焦虑、对人焦虑、孤独倾向、自责倾向、过敏倾向、身体症状、恐怖倾向、冲动倾向8个方面。（原文出处：指引附件2“心理普查结果反馈书”）"},{"f":"7","t":"multi","q":"根据附件2，下列说法符合原文的是（ ）。","o":["MHT包含100个测验题目","MHT超过65分提示可能存在一定心理困扰","SCL-90总分超过160分提示可能存在一定心理障碍","SCL-90结果主要反映最近一周的心理健康状态"],"a":"ABCD","x":"补充解析：附件2写明：MHT共100个测验题目，总分超过65分提示可能存在一定心理困扰；SCL-90总分超过160分提示可能存在一定心理障碍，且结果主要反映最近一周的心理状态。（原文出处：指引附件2“心理普查结果反馈书”）"},{"f":"7","t":"multi","q":"【情境题】某班一名学生进入附件2所列心理预警预备名单。班主任可以采取的处理包括（ ）。","o":["多给予积极关注和肯定鼓励","结合平时表现填写心理危机预警登记表","及时上报学校心理辅导中心","有需要时推荐进行心理辅导"],"a":"ABCD","x":"补充解析：附件2处理建议要求班主任对预警预备名单学生多加积极关注和肯定鼓励、结合平时表现填写预警登记表并及时上报学校心理辅导中心、有需要时推荐心理辅导。（原文出处：指引附件2“心理普查结果反馈书”）"},{"f":"7","t":"multi","q":"【情境题】某学生已经进入严重心理危机状态。根据附件5“学生心理健康状况告知书”的表述，学校可建议监护人（ ）。","o":["陪同学生前往医院或综合医院心理科评估","就医后向学校心理老师反馈结果","重视学生心理问题并及时就医","如诊断后有抑郁状态等类似评估，为保障安全，不建议留校住宿"],"a":"ABCD","x":"补充解析：附件5建议监护人陪同学生前往医院或综合医院心理科评估，就医后向学校心理老师反馈结果，重视心理问题及时就医；如诊断有抑郁状态等类似评估，为保障安全不建议留校住宿。（原文出处：指引附件5“学生心理健康状况告知书”）"},{"f":"8","t":"single","q":"** 中小学心理健康教育的性质定位是（ ）。","o":["提高中小学生心理素质、促进其身心健康和谐发展的教育","针对问题学生的矫治性教育","以心理学知识普及为主的学科教育","辅助升学考试的压力管理训练"],"a":"A","x":"** 文件开宗明义界定心理健康教育是\"提高中小学生心理素质、促进其身心健康和谐发展的教育\"。；原文出处：** 附件1引言。"},{"f":"8","t":"single","q":"** 心理健康教育的主要任务是（ ）。","o":["开展发展性心理健康教育，面向全体学生普遍开展","集中资源治疗有严重心理疾病的学生","为全体学生建立心理档案并分类管控","替代思想品德课程开展行为规范教育"],"a":"A","x":"** 主要任务是开展发展性心理健康教育，面向全体学生普遍开展。；原文出处：** 附件1\"二、工作任务\"。"},{"f":"8","t":"single","q":"** 对于少数有心理困扰或心理问题的学生，正确的做法是（ ）。","o":["进行科学有效的心理辅导，及时给予必要的危机干预","立即停课并通知家长领回","在全班公开其情况以引起关注","要求其自行到医院精神科就诊，学校不再跟进"],"a":"A","x":"** 对少数有心理困扰或心理问题的学生，进行科学有效的心理辅导，及时给予必要的危机干预。；原文出处：** 附件1\"二、工作任务\"。"},{"f":"8","t":"single","q":"** \"根据学生身心发展的特点及心理健康教育的规律，科学开展心理健康教育，注重实践性与实效性\"体现的原则是（ ）。","o":["发展、预防和危机干预相结合","科学性与实效性相结合","面向全体学生和关注个别差异相结合","突出重点和系统治理相结合"],"a":"B","x":"** 依据身心发展特点及教育规律、注重实践性与实效性，对应\"科学性与实效性相结合\"。；原文出处：** 附件1\"三、基本原则\"第1条。"},{"f":"8","t":"single","q":"** \"立足教育和发展，培养学生积极心理品质……在应急和突发事件中及时进行危机干预\"体现的原则是（ ）。","o":["发展、预防和危机干预相结合","科学性与实效性相结合","教师的主导性与学生的主体性相结合","突出重点和系统治理相结合"],"a":"A","x":"** \"立足教育和发展\"\"预防\"\"危机干预\"三要素对应\"发展、预防和危机干预相结合\"。；原文出处：** 附件1\"三、基本原则\"第2条。"},{"f":"8","t":"single","q":"** \"全体教师都要树立心理健康教育意识，尊重学生，平等对待学生……根据不同学生的特点和需求开展心理健康教育和辅导\"体现的原则是（ ）。","o":["面向全体学生和关注个别差异相结合","发展、预防和危机干预相结合","科学性与实效性相结合","突出重点和系统治理相结合"],"a":"A","x":"** 全体教师树立意识、关注个别差异，对应\"面向全体学生和关注个别差异相结合\"。；原文出处：** 附件1\"三、基本原则\"第3条。"},{"f":"8","t":"single","q":"** \"以学校为开展学生心理健康教育的重点工作领域，健全多部门联动机制，加强家庭和社会的协同育人作用\"体现的原则是（ ）。","o":["突出重点和系统治理相结合","面向全体学生和关注个别差异相结合","教师的主导性与学生的主体性相结合","科学性与实效性相结合"],"a":"A","x":"** 学校为重点工作领域、多部门联动、家校社协同，对应\"突出重点和系统治理相结合\"。；原文出处：** 附件1\"三、基本原则\"第5条。"},{"f":"8","t":"single","q":"** 下列哪一项不属于文件规定的心理健康教育内容？（ ）","o":["普及心理健康知识，树立心理健康意识","了解心理调节方法，认识心理异常现象","掌握心理诊断技术，独立开展精神疾病治疗","掌握心理保健常识和技能，形成积极的心理品质"],"a":"C","x":"** 教育内容为普及知识、树立意识、了解调节方法、认识异常现象、掌握保健常识技能、形成积极品质；独立开展精神疾病治疗超出学校职责，且文件明确防止医学化倾向。；原文出处：** 附件1\"四、教育内容\"及\"五、教育途径\"第4条。"},{"f":"8","t":"single","q":"** 下列哪一项属于心理健康教育的核心内容？（ ）","o":["意志品质","亲子教育","生命教育","智力开发"],"a":"C","x":"** 核心内容为自我认识、交往心理、情绪心理、学习心理、社会适应、生命教育。；原文出处：** 附件1\"四、教育内容\"。"},{"f":"8","t":"single","q":"** 下列哪一项不属于文件列出的心理健康教育主题？（ ）","o":["个性品质","生涯规划","社会适应","竞争心理"],"a":"D","x":"** 14个主题中无\"竞争心理\"。；原文出处：** 附件1\"四、教育内容\"主题清单。"},{"f":"8","t":"single","q":"** 心理健康专题教育的课程形态应以（ ）为主。","o":["系统讲授心理学理论","活动","书面测验","医学诊断"],"a":"B","x":"** 心理健康教育课应以活动为主。；原文出处：** 附件1\"五、教育途径\"第1条。"},{"f":"8","t":"single","q":"** 下列哪一项不属于文件列举的心理健康教育课活动形式？（ ）","o":["团体辅导","心理情景剧","专题讲座","精神科会诊"],"a":"D","x":"** 活动形式为团体辅导、心理训练、情境设计、问题辨析、角色扮演、游戏辅导、心理情景剧、专题讲座；精神科会诊属医疗行为。；原文出处：** 附件1\"五、教育途径\"第1条。"},{"f":"8","t":"single","q":"** 学校开设心理健康教育课并列入课程表，课时要求是（ ）。","o":["每班每周至少1课时","每班每两周至少1课时","每班每月至少1课时","每班每学期至少2课时"],"a":"B","x":"** 每班每两周至少安排1课时。；原文出处：** 附件1\"五、教育途径\"第1条。"},{"f":"8","t":"single","q":"** 关于心理健康专题教育，下列说法错误的是（ ）。","o":["应融知识性、趣味性、参与性和操作性为一体","校级以上的教研活动每月不宜少于1次","县级以上的公开课或观摩课活动每学期不宜少于2次","应作为心理学知识的普及和心理学理论的教育来实施"],"a":"D","x":"** 文件明确要防止学科化倾向，\"避免将其作为心理学知识的普及和心理学理论的教育\"，D项与此相悖。；原文出处：** 附件1\"五、教育途径\"第1条。"},{"f":"8","t":"single","q":"** 班主任在学校心理健康教育中的角色定位是（ ）。","o":["主要参与者","专业治疗者","旁观协助者","行政决策者"],"a":"A","x":"** 班主任是学校心理健康教育的主要参与者。；原文出处：** 附件1\"五、教育途径\"第2条。"},{"f":"8","t":"single","q":"** 班主任渗透心理健康教育的规定动作是（ ）。","o":["每学期至少开展一次心理主题班会课","每周对学生进行一次心理测评","每月对问题学生进行一次家访","每学年组织一次心理危机演练"],"a":"A","x":"** 班主任每学期至少要开展一次心理主题班会课。；原文出处：** 附件1\"五、教育途径\"第2条。"},{"f":"8","t":"single","q":"** 班主任在班级工作中要关注的四个建设要素不包括（ ）。","o":["师生关系","同学关系","家校关系","制度文化"],"a":"C","x":"** 四要素为师生关系、同学关系、学习成长、制度文化。；原文出处：** 附件1\"五、教育途径\"第2条。"},{"f":"8","t":"single","q":"** 班主任发现学生心理状态异常时，正确的处理方式是（ ）。","o":["及时与心理健康老师沟通，并和家长沟通","自行对学生进行心理诊断","在班会上点名批评以儆效尤","要求学生签署保密承诺后自行调整"],"a":"A","x":"** 班主任需洞察学生心理状态，及时与心理健康老师沟通，和家长沟通。；原文出处：** 附件1\"五、教育途径\"第2条。"},{"f":"8","t":"single","q":"** 学科教学渗透心理健康教育，教学评价应体现的理念是（ ）。","o":["发展性、多元化评价","终结性、标准化评价","甄别性、排名化评价","选拔性、单一化评价"],"a":"A","x":"** 教学评价要体现发展性、多元化评价的理念。；原文出处：** 附件1\"五、教育途径\"第3条。"},{"f":"8","t":"single","q":"** 学科教学渗透心理健康教育，教学过程应关注的是（ ）。","o":["学生的思维、情感、态度等心理因素的发展","学生成绩排名的变化","课堂纪律的绝对安静","教学进度的严格完成"],"a":"A","x":"** 教学过程要关注学生的思维、情感、态度等心理因素的发展。；原文出处：** 附件1\"五、教育途径\"第3条。"},{"f":"8","t":"single","q":"** 对个别有严重心理疾病的学生进行转介，转介前必须（ ）。","o":["征得学生监护人同意","经全班同学知情同意","报市级指导中心审批","在校园公示一周"],"a":"A","x":"** 学生转介前需征得学生监护人同意。；原文出处：** 附件1\"五、教育途径\"第4条。"},{"f":"8","t":"single","q":"** 关于学生转介，下列说法错误的是（ ）。","o":["学校应有专门的合作医疗机构，保证转介顺利完成","转介过程记录详实，并建立跟踪反馈制度","学校可直接将学生强制送医","转介是心理辅导工作中的规范环节"],"a":"C","x":"** 转介须监护人同意、有专门合作医疗机构、记录详实并跟踪反馈，\"强制送医\"违反程序。；原文出处：** 附件1\"五、教育途径\"第4条。"},{"f":"8","t":"single","q":"** 开展心理辅导工作，下列做法符合规范的是（ ）。","o":["做好记录，建立心理辅导档案，做好跟踪工作","将辅导记录作为评优评先的依据公示","为每位学生建立公开的心理健康排名","用辅导档案代替教学档案统一保管"],"a":"A","x":"** 心理辅导中要做好记录，建立心理辅导档案，做好跟踪工作。；原文出处：** 附件1\"五、教育途径\"第4条。"},{"f":"8","t":"single","q":"** 开展心理辅导的基础前提是（ ）。","o":["学生知情自愿","家长全程旁听","班主任批 建设的指导意见》要求，规范落实中小学校和幼儿园晨午检、（ ）追踪登记等制度，常态化开展传染病防控。","o":["病假事假","迟到早退","心理预警","因病缺勤缺课"],"a":"D","x":"原文“三、主要举措（三）提高学校健康管理能力”：“规范落实中小学校和幼儿园晨午检、因病缺勤缺课追踪登记等制度。”"},{"f":"12","t":"single","q":"根据《教育部关于全面推进健康学校建设的指导意见》，中小学校应改善教室灯光照明，根据学生身高配备（ ）。","o":["坐姿矫正器","护眼照明灯","可调节课桌椅","升降黑板"],"a":"C","x":"原文“三、主要举措（四）优化学校健康空间环境”：“中小学校改善教室灯光照明，根据学生身高配备可调节课桌椅。”"},{"f":"12","t":"single","q":"《教育部关于全面推进健康学校建设的指导意见》要求，将健康学校建设成效纳入（ ），作为对学校评价考核的参考因素。","o":["教育督导内容","教育经费分配","招生计划编制","教师职称评聘"],"a":"A","x":"原文“四、组织保障”：“将健康学校建设成效纳入教育督导内容，作为对学校评价考核的参考因素。”"},{"f":"12","t":"multi","q":"根据《教育部关于全面推进健康学校建设的指导意见》，健康学校建设的阶段性目标包括（ ）。","o":["到2027年，高标准完成教育强国建设三年行动计划综合改革试点健康学校建设试点","到2027年，健康学校工作规范和评价标准基本完善","到2027年，形成一大批可复制可推广的工作案例和经验","到2030年，健康学校建设覆盖每所学校","到2035年，普遍建成更高质量的健康学校"],"a":"ABCDE","x":"原文“一、总体要求”分阶段规定：到2027年“高标准完成教育强国建设三年行动计划综合改革试点健康学校建设试点”“健康学校工作规范和评价标准基本完善”“形成一大批可复制可推广的工作案例和经验”；到2030年“健康学校建设覆盖每所学校”；到2035年“普遍建成更高质量的健康学校”。A—E项均正确。"},{"f":"12","t":"multi","q":"根据《教育部关于全面推进健康学校建设的指导意见》，深化心理健康教育的举措包括（ ）。","o":["以德育心、以智慧心、以体强心、以美润心、以劳健心","将心理健康作为家长学校和家长会、家长课堂、家访等活动的选讲内容","把心理健康工作贯穿教育、教学、服务全过程","将心理健康作为家长学校和家长会、家长课堂、家访等活动的必讲内容","心理健康教育课程仅面向出现心理困扰的学生开设"],"a":"ACD","x":"A、C、D项符合原文“二、重点任务（四）深化心理健康教育”要求。B项错误，原文为“必讲内容”而非“选讲内容”；E项错误，与原文“全员育心”“把心理健康工作贯穿教育、教学、服务全过程”及“中小学阶段鼓励开设心理健康地方课程、校本课程”不符。"},{"f":"12","t":"multi","q":"根据《教育部关于全面推进健康学校建设的指导意见》，加强学校体育工作的举措包括（ ）。","o":["推行“课间10分钟”，延长学生课间活动时间","促进学生至少掌握1项运动技能","组织学生每周至少参加1次有强度的课外体育锻炼","落实中小学生每天综合体育活动时间不低于2小时","实施大学生体质提升专项行动，组织学生每周至少参加3次有强度的课外体育锻炼"],"a":"BDE","x":"B、D、E项符合原文“二、重点任务（一）加强学校体育工作”要求。A项错误，原文为推行“课间15分钟”；C项错误，原文为组织学生“每周至少参加3次”有强度的课外体育锻炼，而非“1次”。"},{"f":"12","t":"multi","q":"根据《教育部关于全面推进健康学校建设的指导意见》，综合防控近视的举措包括（ ）。","o":["深入落实中小学生手机、作业、考试、睡眠、读物和体质等管理","坚持预防为主，科学保护儿童远视储备量","抓好幼儿园和小学近视防控关键阶段，保障充足户外活动时间","取消课间休息和户外活动，增加课堂学习时间","引导家长改变“重治轻防”观念"],"a":"ABCE","x":"A、B、C、E项符合原文“二、重点任务（五）综合防控近视”要求。D项错误，与原文“创造条件保障充足户外活动时间”相悖。"},{"f":"12","t":"multi","q":"根据《教育部关于全面推进健康学校建设的指导意见》，有效管理体重的举措包括（ ）。","o":["制订实施中小学生肥胖防控工作方案","学校提供符合学生营养需求的食物，每周公示带量食谱","将学生体重情况 动，为青春期学生提供情绪疏导渠道。（原文出处：同上4）"},{"f":"14","t":"single","q":"以劳健心，小学低年级结合（ ）开展劳育活动。","o":["职业岗位模拟","日常生活实践","创业设计","社会服务"],"a":"B","x":"补充解析：以劳健心在小学低年级结合日常生活实践开展劳育活动，重点培育责任意识和良好行为习惯。（原文出处：指引“三、工作内容（五）以劳健心在不同学段的工作重点”1）"},{"f":"14","t":"single","q":"以劳健心，初中年级开展（ ）类劳动项目。","o":["日常生活劳动","职业体验和社会实践","家庭家务","简单种植"],"a":"B","x":"补充解析：以劳健心在初中年级开展职业体验和社会实践类劳动项目，强化问题解决能力和社会适应能力。（原文出处：同上4）"},{"f":"14","t":"single","q":"以劳健心，高中年级实施（ ），培养职业适应能力和责任担当。","o":["生活自理劳动","职业情境模拟和岗位体验","手工制作","校园卫生值日"],"a":"B","x":"补充解析：以劳健心在高中年级实施职业情境模拟和岗位体验类劳动教育，培养职业适应能力和责任担当。（原文出处：同上5）"},{"f":"14","t":"single","q":"下列哪项不属于\"大思政类课程\"（ ）。","o":["道德与法治课","思想政治课","班会课、少先队课、共青团课","物理课"],"a":"D","x":"补充解析：大思政类课程包括道德与法治课、思想政治课以及班会课、少先队课、共青团课等；物理课属于文理智育类课程。（原文出处：指引“四、实施路径（一）1大思政类课程、2文理智育类课程”）"},{"f":"14","t":"single","q":"校园主题活动渗透心理健康教育，下列实施要点错误的是（ ）。","o":["在活动中渗透心理元素","结合活动环节渗透心理健康知识","通过活动强化心理支持","以考试成绩作为活动唯一评价标准"],"a":"D","x":"补充解析：校园主题活动实施要点为渗透心理元素、结合活动环节渗透心理健康知识、通过活动强化心理支持，文件未以考试成绩作为活动唯一评价标准。（原文出处：指引“四、实施路径（二）校园主题活动”）"},{"f":"14","t":"single","q":"校园心理文化建设应遵循的原则不包括（ ）。","o":["情感可视化","行为互动化","价值正向化","装饰商业化"],"a":"D","x":"补充解析：校园心理文化建设遵循情感可视化、行为互动化、价值正向化原则，无“装饰商业化”。（原文出处：指引“四、实施路径（三）校园心理文化建设”3）"},{"f":"14","t":"single","q":"在人员组织中，作为一线育人主体的是（ ）。","o":["学校党政领导","班主任和学科教师","心理教师","食堂工作人员"],"a":"B","x":"补充解析：班主任和学科教师作为一线育人主体，在课堂教学、班级管理和学生日常指导中落实相关要求。（原文出处：指引“五、工作保障（一）人员组织”）"},{"f":"14","t":"single","q":"本指引强调心理健康教育队伍应由\"专人负责\"向（ ）转变。","o":["\"全员旁观\"","\"多方协同、整体推进\"","\"外包给社会机构\"","\"仅由心理教师负责\""],"a":"B","x":"补充解析：队伍建设要求推动心理健康教育由“专人负责”向“多方协同、整体推进”转变。（原文出处：指引“五、工作保障（二）队伍建设”）"},{"f":"14","t":"single","q":"效果评估中的\"学期初基线评估\"可采用的方法是（ ）。","o":["科学测评工具或结构化访谈","仅期末考试成绩","仅教师课堂观察","仅学生自查日记"],"a":"A","x":"补充解析：学期初基线评估可采用科学测评工具或结构化访谈，也可通过教师评分或家长问卷了解学生特点与需求。（原文出处：指引“六、效果评估（一）常态化评估”1）"},{"f":"14","t":"multi","q":"本指引提出的基本原则包括（ ）。","o":["坚持立德树人，五育并举","坚持贯穿全过程，融入育人环节","坚持协同育人，整合各方资源","坚持全员参与，突出能力提升","坚持预防为先，注重实效创新"],"a":"ABCDE","x":"补充解析：五项基本原则即立德树人五育并举、贯穿全过程、协同育人、全员参与、预防为先。（原文出处：指引“一、总则（二）基本原则”）"},{"f":"14","t":"multi","q": 融合协作","校家协同共育","校社联动赋能","完全依赖学生自学自悟"],"a":"ABC","x":"补充解析：协作机制包括校内融合协作、校家协同共育、校社联动赋能。（原文出处：指引“五、工作保障”协作机制）"},{"f":"14","t":"multi","q":"常态化评估应覆盖的维度包括（ ）。","o":["学生心理素养","课程实施质量","教师能力和参与度","学校建筑外观"],"a":"ABC","x":"补充解析：常态化评估覆盖学生心理素养、课程实施质量、教师能力和参与度等维度，并贯穿教学始终。（原文出处：指引“六、效果评估（一）常态化评估”）"},{"f":"14","t":"multi","q":"多渠道反馈的层面包括（ ）。","o":["学生层面","教师层面","家长与社会层面","仅上级教育行政部门层面"],"a":"ABC","x":"补充解析：多渠道反馈包括学生层面、教师层面、家长与社会层面。（原文出处：指引“六、效果评估（二）多渠道反馈”）"},{"f":"15","t":"single","q":"依据守则，学校心理健康教育教师专业能力标准与《学校心理工作伦理守则》的关系是（　　）。","o":["守则是专业能力标准中必须遵守的专业伦理规范","守则仅在处理投诉时适用","守则与专业能力标准无关","守则只约束心理咨询机构人员"],"a":"A","x":"守则前言明确：本守则也是学校心理健康教育教师专业能力标准中必须遵守的专业伦理规范。（原文出处：守则·前言）"},{"f":"15","t":"single","q":"依据守则，下列不属于守则适用范围的是（　　）。","o":["中小学校和幼儿园","高校和技工院校","医院、社区及面向学生开展心理服务的政府机构与咨询机构","校外经营性学科培训机构的晚间自习室"],"a":"D","x":"守则适用于开展学校心理工作的各场所，包括中小学校、幼儿园、高校、技工院校、医院、社区，以及面向学生开展心理服务的政府机构与咨询机构等，不包括普通学科培训机构的晚间自习室。（原文出处：守则·前言）"},{"f":"15","t":"single","q":"关于守则的约束对象，下列说法正确的是（　　）。","o":["仅约束学校专职心理教师","仅约束心理专业在校实习生","凡在学校心理工作场所从事学校心理服务的人员都有义务熟悉并依据守则","仅约束取得心理咨询师证书的人员"],"a":"C","x":"守则写明：凡在学校心理工作场所从事学校心理服务的人员都有义务熟悉本守则，并依据本守则尊重学生尊严和价值、考虑学生利益和权利。（原文出处：守则·前言）"},{"f":"15","t":"single","q":"守则总则中，强调工作目的是让接受服务的学生及其他人士从专业服务中获益、努力保障其权利并避免伤害的原则是（　　）。","o":["善行","责任","诚信","尊重"],"a":"A","x":"守则将“善行”界定为：工作目的是让服务对象从专业服务中获益，应保障权利、努力使其得到适当服务并避免伤害。（原文出处：守则·总则）"},{"f":"15","t":"single","q":"守则总则要求学校心理工作者“保持服务工作的专业水准，认清自己的专业、伦理及法律责任，维护专业信誉，并承担相应的社会责任”，这体现的原则是（　　）。","o":["责任","善行","公正","诚信"],"a":"A","x":"该表述与守则对“责任”的界定一致，即保持专业水准、认清专业伦理及法律责任、维护专业信誉并承担社会责任。（原文出处：守则·总则）"},{"f":"15","t":"single","q":"守则总则指出，学校心理工作者在工作中应做到诚实守信，在辅导实践、研究及发表、教学工作以及各类媒体的宣传推广中保持（　　）。","o":["权威性","真实性","独创性","中立性"],"a":"B","x":"守则“诚信”原则明确要求诚实守信，并在各类宣传推广中保持真实性。（原文出处：守则·总则）"},{"f":"15","t":"single","q":"守则要求学校心理工作者公平、公正地对待专业相关工作及人员，谨慎防止自己潜在的偏见、能力局限、技术限制等导致不适当行为，这体现的原则是（　　）。","o":["公正","尊重","善行","责任"],"a":"A","x":"这是守则对“公正”原则的表述：公平公正对待专业相关工作及人员，防止潜在偏见、能力局限、技术限制等导致不适当行为。（原文出处：守则·总则）"},{"f":"15","t":"single","q":"守则总则要求尊重接受学校心理服务人员，尊重其（　　），这体现“尊重”原则。","o":["隐私权、保密性和自我决定的权利","宗教信仰自由","参与学校管理的权利","获得免费午餐的权利"],"a":"A","x":"守则“尊重”原则指尊重接受服务人员，尊重其隐私权、保密性和自我决定的权利。（原文出处：守则·总则）"},{"f":"15","t":"single","q":"依据守则第1.1条，接受学校心理服务者有权充分了解的信息不包括（　　）。","o":["提供心理服务人员的专业资质、工作经验及受训背景","服务的目标和程序、保密制度及保密例外","谁将收到关于评估或干预结果的信息及服务的可能后果","提供服务人员个人的家庭收入与生活情况"],"a":"D","x":"服务对象有权了解的是专业资质经验、服务目标程序、保密制度及例外、信息接收对象和服务可能后果等与专业服务直接相关的信息，不包括服务人员个人家庭收入。（原文出处：守则·知情同意1.1）"},{"f":"15","t":"single","q":"依据守则，知情同意是一个持续过程，需要重新讨论的适当情形是（　　）。","o":["先前商定的目标和服务发生重大变化时，或必须与他人共享敏感信息时","每完成一次咨询后","学生每次更换班主任后","学校更换校领导后"],"a":"A","x":"守则第1.2条：当先前商定的目标和服务发生重大变化时，或必须与他人共享敏感信息时，应在适当时候重新讨论知情同意。（原文出处：守则·知情同意1.2）"},{"f":"15","t":"single","q":"为保护学生利益，允许在没有家长知情同意情况下开展的活动是（　　）。","o":["向学生开展心理健康教育活动、心理健康教育课程","对未成年学生实施医学治疗","将学生心理档案移交校外营利机构","组织学生参与有报酬的商业调查"],"a":"A","x":"守则第1.4条列明：允许在没有家长知情同意的情况下向学生开展心理健康教育活动、心理健康教育课程。（原文出处：守则·知情同意1.4）"},{"f":"15","t":"single","q":"学校心理工作者在查看学生的学习记录、心理档案时，依据守则应当（　　）。","o":["先征得学生家长书面同意","不需要家长同意","先征得学校法律顾问同意","先征得当地教育局批准"],"a":"B","x":"守则第1.4条明确规定：学校心理工作者在查看学生的学习记录、心理档案时，不需要家长的同意。（原文出处：守则·知情同意1.4）"},{"f":"15","t":"single","q":"依据守则第1.4条，下列情形中允许学校心理工作者在未通知家长或未取得家长同意的情况下提供心理援助的是（　　）。","o":["紧急情况下，或有理由认为学生有自我伤害风险，或可能对他人构成危险，或处于被伤害、剥削或虐待的危险中","学生因学业成绩波动希望参加校外补习","家长与班主任存在一般性沟通分歧","学校需要统计学生家庭收入情况"],"a":"A","x":"守则第1.4条第（3）项明确：在紧急情况下，或有理由认为学生有自我伤害风险、可能对他人构成危险、或处于被伤害、剥削或虐待的危险中时，允许在未通知家长或取得家长同意的情况下提供心理援助。（原文出处：守则·知情同意1.4）"},{"f":"15","t":"single","q":"关于未成年学生心理健康测评，依据守则下列说法正确的是（　　）。","o":["学校心理工作者可自行决定是否测评，无需告知家长","必须通知家长，家长有权决定是否让孩子参加测评","只需在学生测完后告知家长结果","测评仅需班主任同意即可"],"a":"B","x":"守则第1.5条：为未成年学生开展心理健康测评时，必须通知家长，家长有权利决定是否让他们孩子参加测评。（原文出处：守则·知情同意1.5）"},{"f":"15","t":"single","q":"依据守则，学校心理工作者可以绕开学生同意开展服务的情形是（　　）。","o":["服务被认为对学生有直接好处或从法律上来说是必须的，且得到学校管理部门授权","学生家长出差无法到场","学生所在班级成绩普遍下滑","学校心理咨询室值班人手不足"],"a":"A","x":"守则第1.6条：学校心理工作者鼓励学生自愿参与心理服务，但如果服务被认为对学生有直接好处或从法律上来说是必须的，在学校管理部门授权的情况下，绕开学生同意的服务是允许的。（原文出处：守则·知情同意1.6）"},{"f":"15","t":"single","q":"当学生、教师、同事等各方利益发生冲突时，学校心理工作者依据守则应当（　　）。","o":["首先考虑学校的声誉","首先考虑学生的利益","首先考虑家长的意见","首先考虑心理工作者的个人利益"],"a":"B","x":"守则第2.4条：要最大限度地保障学生、教师、同事等群体的利益，当各方利益发生冲突时，应首先考虑学生的利益。（原文出处：守则·专业关系2.4）"},{"f":"15","t":"single","q":"依据守则第2.6条，学校心理工作者（　　）。","o":["严格禁止与学生发生性关系及其他亲密关系","可以与毕业多年后的学生谈恋爱","可以与学生家长建立恋爱关系","只要双方自愿，可与当前服务学生建立亲密关系"],"a":"A","x":"守则第2.6条明确：严格禁止与学生发生性关系及其它亲密关系，不得与当前开展心理服务的学生父母、兄弟姐妹或其他近亲发生性关系及其它亲密关系。（原文出处：守则·专业关系2.6）"},{"f":"15","t":"single","q":"关于学校心理工作者收费与服务地点，下列符合守则第2.9条的是（　　）。","o":["在学校开展心理服务时不得收取任何报酬","可以利用工作时间在校外机构有偿接个案","可以为所在学校师生提供校外有偿心理服务","可以向学生家长收取一次性“建档费”"],"a":"A","x":"守则第2.9条：在学校开展心理服务时不得收取任何报酬；不得为工作所在学校师生提供学校外的有偿心理服务；一般应校内为学生提供心理服务，不得在工作时间从事有偿的咨询工作。（原文出处：守则·专业关系2.9）"},{"f":"15","t":"single","q":"依据守则，如果学生急需援助，关于讨论保密问题的处理，正确的是（　　）。","o":["允许推迟讨论保密问题，直到危机解除","必须拒绝服务直到学生签署保密协议","一律由班主任代签知情同意书","直接在班级公布保密制度"],"a":"A","x":"守则第3.1条：如果学生急需援助，允许推迟讨论保密问题，直到危机解除；同时应认识到持续讨论保密问题是必要的。（原文出处：守则·隐私和保密3.1）"},{"f":"15","t":"single","q":"依据守则，学校心理工作者在咨询、教学和研究中获得的学生个人信息，正确的处理是（　　）。","o":["不得泄露，学生记录应存放在安全的地方保存","可以在同事聚餐时交流","可以用于教师个人课题成果宣传","可以在学校大会上作案例点评"],"a":"A","x":"守则第3.3条：学校心理工作者不得泄露咨询、教学和研究中获得的学生个人信息，学生记录要放在安全的地方进行保存。（原文出处：守则·隐私和保密3.3）"},{"f":"15","t":"single","q":"依据守则，学校心理工作者讨论学生个人情况时（　　）。","o":["只可为更好帮助学生的目的，与有明确关系的人（如家长、班主任、辅导员等）讨论","可在全体教职工大会上匿名讨论，无需限制对象","可在家长微信群公开讨论以引起重视","可向校外培训机构介绍学生情况以便其提供“辅导”"],"a":"A","x":"守则第3.4条：学生个人情况只可在为了更好帮助学生的目的下讨论，只可与学生有明确关系的人（如家长、班主任、辅导员等）进行讨论。（原文出处：守则·隐私和保密3.4）"},{"f":"15","t":"single","q":"依据守则第3.5条，与他人共享学生心理服务相关数据的前提是（　　）。","o":["经过学校心理健康教育领导小组批准即可","获得学生及未成年学生家长的允许","只要不写学生姓名即可","只要出于教育科研目的即可"],"a":"B","x":"守则第3.5条：不允许在没有学生及未成年学生家长允许的情况下，与他人共享学生心理服务相关数据。（原文出处：守则·隐私和保密3.5）"},{"f":"15","t":"single","q":"当所需提供的服务超出学校心理工作者个人能力范围时，依据守则应当（　　）。","o":["向学生解释自己的局限性，并向其他专业人士或督导求助","为保证服务连续性硬着头皮继续","让学生自行另寻机构，不再跟进","建议学校将其列为“不配合教育”处理"],"a":"A","x":"守则第4.2条：必须明确自己能力局限，在超出个人能力范围时，应向学生解释自己的局限性，并向其他专业人士或督导求助。（原文出处：守则·专业胜任力4.2）"},{"f":"15","t":"single","q":"当学校心理工作者的个人问题可能危及服务专业性时，依据守则应当（　　）。","o":["及时寻求咨询或其他帮助","暂停工作并永久回避专业服务","隐瞒个人问题继续服务","把个人问题归因于学生"],"a":"A","x":"守则第4.4条：当个人问题可能危及服务专业性时，应及时寻求咨询或其他帮助。（原文出处：守则·专业胜任力4.4）"},{"f":"15","t":"single","q":"依据守则，将学生转介给其他专业人士时，学校心理工作者应当（　　）。","o":["征得学生及其家长同意，并对被转介咨询师或医生的专业能力有所了解","自行决定转介并停止关注学生","要求被转介机构签署保密免责协议","向被转介机构收取转介费"],"a":"A","x":"守则第4.7条：当学生心理问题超出能力范围时，在征得学生及其家长同意后可以转介；转介时要对被转介咨询师或医生的专业能力有所了解，并在咨询或治疗期间密切关注学生心理状况。（原文出处：守则·专业胜任力4.7）"},{"f":"15","t":"single","q":"依据守则，学校心理工作者使用心理测量与评估工具的根本目的在于（　　）。","o":["帮助、促进学生成长","识别出有“问题”的学生","完成上级规定的测评任务","为心理档案积累数据"],"a":"A","x":"守则第5.1条：要确保心理测量与评估的目的在于帮助学生成长；测评时要考虑服务对象的心理发展阶段、个人特征和文化背景。（原文出处：守则·心理测量与评估5.1）"},{"f":"15","t":"single","q":"当量表被修订或量表的测量效度受到质疑时，依据守则学校心理工作者应当（　　）。","o":["在测量报告中有所体现并做出相应合理解释","直接停用该量表并删除所有数据","仅在内部口头说明，不写入报告","照常按原有标准解释结果"],"a":"A","x":"守则第5.2条：如对量表进行修订，或量表的测量效度受到质疑，测量报告中一定要有所体现，并做出相应的合理解释。（原文出处：守则·心理测量与评估5.2）"},{"f":"15","t":"single","q":"使用其他国家编制的心理测量工具时，依据守则应当（　　）。","o":["确保已建立中国常模，并完成相应的信度与效度研究","只要原文翻译准确即可直接使用","由学校自主决定是否建常模","只需在报告中注明“仅供参考”"],"a":"A","x":"守则第5.3条：使用其他国家编制的心理测量工具，应确保已建立中国常模，并完成相应的信度与效度研究。（原文出处：守则·心理测量与评估5.3）"},{"f":"15","t":"single","q":"依据守则第5.5条，学校心理工作者使用心理测量前应当（　　）。","o":["对测验内容、施测、计分、解释、应用等受过适当的专业训练","取得学生家长的书面授权书","向当地教育局备案所用问卷","完成学校心理委员培训即可"],"a":"A","x":"守则第5.5条：应对所实施的测验内容、施测、计分、解释、应用等有适当的专业训练；未接受专业训练或资质不足者不得使用心理测量。（原文出处：守则·心理测量与评估5.5）"},{"f":"15","t":"single","q":"依据守则，对学生开展心理评估时（　　）。","o":["要综合不同来源、不同类型的信息，不能单靠心理测量结果","心理测量结果准确度高，应以问卷分数为唯一依据","班主任访谈只作参考，不计入评估","只要测量分数异常即可直接诊断为心理疾病"],"a":"A","x":"守则第5.7条：解释测验结果应力求客观、正确及完整；开展心理评估时要综合不同来源、不同类型的信息，单靠心理测量结果无法对学生心理状况进行明确评估。（原文出处：守则·心理测量与评估5.7）"},{"f":"15","t":"single","q":"关于学生及家长查看心理测量结果，下列符合守则第5.8条的是（　　）。","o":["学生或家长可以查看相关内容，但不能复制结果或拍照","家长可以复印量表用于自行解读","学生可以把问卷拍照发布到网络","家长可以要求心理教师交出原始问卷原件"],"a":"A","x":"守则第5.8条：学校心理工作者应尊重学生查看本人、或家长查看未成年孩子心理测量问卷内容和结果的权利，但不能复制结果或拍照。（原文出处：守则·心理测量与评估5.8）"},{"f":"15","t":"single","q":"使用人工智能技术对学生进行心理测量与评估时，依据守则应当选用（　　）。","o":["经教育部门认可且通过伦理审查的评估工具","市面上评分最高的人工智能应用","学校自行开发并测试过的任何程序","免费且无需账号的在线工具"],"a":"A","x":"守则第5.10条：在使用人工智能技术进行心理测量与评估时，应选用经教育部门认可且通过伦理审查的评估工具。（原文出处：守则·心理测量与评估5.10）"},{"f":"15","t":"single","q":"下列不属于守则列举的学生心理服务记录内容的是（　　）。","o":["个体辅导记录、团体辅导记录","心理测量结果、评估性访谈
