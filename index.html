function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function normAns(a){return (a||"").split("").sort().join("");}
function visibleIds(){
  if(state.scope==="wrong"){
    if(!state.wq)return [];
    var out=[];
    for(var a=0;a<state.wq.length;a++){
      var qi=state.wq[a],q=Q[qi];
      if(state.type==="all"||q.t===state.type)out.push(qi);
    }
    return out;
  }
  return Q.map(function(q,i){return i;}).filter(function(i){
    var q=Q[i];
    if(!state.files[q.f])return false;
    if(state.type==="single"&&q.t!=="single")return false;
    if(state.type==="multi"&&q.t!=="multi")return false;
    return true;
  });
}
function selOf(i){
  var a=answerOf(i);
  if(a)return a.sel;
  var s=state.sel[i];
  return s?s:[];
}
function isDone(i){return !!answerOf(i);}

function letter(j){return String.fromCharCode(65+j);}

function optClass(i,k){
  var q=Q[i],c="opt";
  if(isDone(i)){
    c+=" locked";
    if(q.a.indexOf(k)>=0){c+=" right";}
    else if(selOf(i).indexOf(k)>=0){c+=" wrong";}
  }else if(selOf(i).indexOf(k)>=0){c+=" sel";}
  return c;
}
function markHtml(i,k){
  var q=Q[i];
  if(!isDone(i))return "";
  if(q.a.indexOf(k)>=0)return '<span class="mark" style="color:var(--green)">&#10003;</span>';
  if(selOf(i).indexOf(k)>=0)return '<span class="mark" style="color:var(--red)">&#10007;</span>';
  return "";
}
function optsHtml(i){
  var q=Q[i],h="",s="";
  for(var j=0;j<q.o.length;j++){
    s='<div class="'+optClass(i,letter(j))+'" data-k="'+letter(j)+'"><span class="k">'+letter(j)+'.</span><span>'+esc(q.o[j])+'</span>'+markHtml(i,letter(j))+'</div>';
    h+=s;
  }
  return '<div class="opts">'+h+'</div>';
}
function cardHtml(i,localNo,totalNo){
  var q=Q[i];
  var tp=q.t==="single"?"单选":"多选";
  var h='<div class="q-card" id="qc">';
  h+='<div class="q-head"><span class="q-no">第'+localNo+'题 / 共'+totalNo+'题</span>';
  h+='<span class="badge '+q.t+'">'+tp+'</span><span class="q-doc">文件'+('0'+q.f).slice(-2)+' · '+esc(DOCS[q.f].replace(/^\d+\s*/,""))+'</span></div>';
  h+='<div class="q-text">'+esc(q.q)+'</div>'+optsHtml(i);
  if(!isDone(i)){
    h+='<div class="submitRow"><button id="btnSubmit" type="button">提交答案</button></div>';
  }
  var reveal=revealHtml(i,false);
  if(reveal)h+=reveal;
  return h+'</div>';
}
function revealHtml(i,forceReview){
  var q=Q[i];
  if(!forceReview&&!isDone(i))return "";
  var correct=forceReview||answerOf(i).ok;
  var cls=forceReview?"review":(correct?"correct":"incorrect");
  var head=forceReview?"":"<b>"+(correct?"回答正确":"回答错误")+"</b>　";
  var your="";
  if(!forceReview&&!correct){your="你的答案："+esc(selOf(i).join("、"))+"　";}
  var h='<div class="reveal show '+cls+'">'+head+'正确答案：<span class="ans">'+esc(q.a.split("").join("、"))+'</span>　'+your;
  h+='<div style="margin-top:4px"><b>解析：</b>'+esc(q.x)+'</div></div>';
  return h;
}
function navHtml(ids,pos){
  var h='<div class="navBtns">';
  h+='<button id="btnPrev" type="button" '+(pos>0?"":"disabled style=\"opacity:.45\"")+'>上一题</button>';
  h+='<button id="btnNext" class="primary" type="button">'+(pos>=ids.length-1?"查看成绩":"下一题")+'</button></div>';
  return h;
}

function renderPractice(){
  var ids=visibleIds();
  if(ids.length===0){quizBox.innerHTML='<div class="empty">当前筛选下暂无题目，请切换文件或题型。</div>';return;}
  if(state.cur<0||state.cur>=ids.length)state.cur=0;
  var i=ids[state.cur];
  var curQ=Q[i];
  quizBox.innerHTML=cardHtml(i,state.cur+1,ids.length);
  var opts=quizBox.querySelectorAll(".opt");
  if(!isDone(i)){
    for(var k=0;k<opts.length;k++){
      opts[k].addEventListener("click",(function(k){
        return function(){
          var q=Q[i],sel=selOf(i).slice();
          var L=opts[k].getAttribute("data-k");
          if(q.t==="single"){sel=[L];}
          else{
            var p=sel.indexOf(L);
            if(p>=0)sel.splice(p,1);else sel.push(L);
          }
          state.sel[i]=sel;
          renderPractice();
        };
      })(k));
    }
    var sb=document.getElementById("btnSubmit");
    if(sb)sb.addEventListener("click",function(){
      var sel=(state.sel[i]||[]).slice();
      if(!sel.length){alert(curQ.t==="single"?"请先选择一个选项":"请先选择至少一个选项");return;}
      var ok=normAns(sel.join(""))===normAns(curQ.a);
      setAnswer(i,sel,ok);
      delete state.sel[i];
      if(ok){if(isWrong(i))removeWrong(i);}else{addWrong(i,sel);}
      trackEvent("quiz","answer","F"+curQ.f+"_"+curQ.t,ok?1:0);
      updateWrongCounts();
      state.userNavigated=true;
      saveRange(true);
      renderPractice();
      updateStats();
      if(ids.every(function(id){return isDone(id);}))showSummary(ids);
    });
  }
  var nav=quizBox.querySelectorAll(".navBtns");
  if(!nav.length){
    var dv=document.createElement("div");
    dv.innerHTML=navHtml(ids,state.cur);
    quizBox.appendChild(dv.firstChild);
    bindNav(ids);
  }
  quizBox.scrollIntoView({behavior:"smooth",block:"start"});
}
function bindNav(ids){
  var prev=document.getElementById("btnPrev"),next=document.getElementById("btnNext");
  if(prev)prev.addEventListener("click",function(){
    if(state.scope==="wrong"&&state.wq&&state.cur>0){state.cur--;state.userNavigated=true;saveRange(true);renderPractice();return;}
    if(state.cur>0){state.cur--;state.userNavigated=true;saveRange(true);renderPractice();}
  });
  if(next)next.addEventListener("click",function(){
    if(state.scope==="wrong"&&state.wq){
      var curId=state.wq[state.cur];
      if(curId!=null&&answerOf(curId)&&answerOf(curId).ok){
        state.wq.splice(state.cur,1);
        if(!state.wq.length){
          state.scope="all";state.wq=null;state.mode="wrongbook";setModeBtns("wrongbook");render();return;
        }
        if(state.cur>=state.wq.length)state.cur=state.wq.length-1;
      }
      var wids=visibleIds();
      if(state.cur<wids.length-1){state.cur++;state.userNavigated=true;saveRange(true);renderPractice();}
      else{state.scope="all";state.wq=null;showSummary(wids);}
      return;
    }
    var all=visibleIds();
    if(state.cur<all.length-1){state.cur++;state.userNavigated=true;saveRange(true);renderPractice();}
    else{showSummary(all);}
  });
}
function renderReview(){
  var ids=visibleIds();
  if(ids.length===0){quizBox.innerHTML='<div class="empty">当前筛选下暂无题目。</div>';return;}
  var h="";
  for(var n=0;n<ids.length;n++){
    var i=ids[n],q=Q[i];
    h+='<div class="q-card">';
    h+='<div class="q-head"><span class="q-no">'+(n+1)+'.</span><span class="badge '+q.t+'">'+(q.t==="single"?"单选":"多选")+'</span><span class="q-doc">文件'+('0'+q.f).slice(-2)+' · '+esc(DOCS[q.f].replace(/^\d+\s*/,""))+'</span></div>';
    h+='<div class="q-text">'+esc(q.q)+'</div>';
    h+='<div class="opts">';
    for(var j=0;j<q.o.length;j++){
      var cls="opt locked"+(q.a.indexOf(letter(j))>=0?" right":"");
      h+='<div class="'+cls+'"><span class="k">'+letter(j)+'.</span><span>'+esc(q.o[j])+'</span>'+(q.a.indexOf(letter(j))>=0?'<span class="mark" style="color:var(--green)">&#10003;</span>':"")+'</div>';
    }
    h+='</div>'+revealHtml(i,true)+'</div>';
  }
  quizBox.innerHTML=h;
  window.scrollTo({top:0,behavior:"smooth"});
}

function wrongKey(i){return qidOf(i);}
function isWrong(i){return !!state.store.wrongbook[qidOf(i)];}
function wrongIndices(){
  var out=[];
  for(var i=0;i<Q.length;i++){if(isWrong(i))out.push(i);}
  return out;
}
function addWrong(i,sel){
  state.store.wrongbook[qidOf(i)]={sel:sel.slice(),t:Date.now()};
  persistNow();
}
function removeWrong(i){
  delete state.store.wrongbook[qidOf(i)];
  persistNow();
}
function clearWrong(){state.store.wrongbook={};persistNow();}
function updateWrongCounts(){
  var n=wrongIndices().length;
  var a=document.getElementById("mWrong"),b=document.getElementById("btnWrongBook");
  if(a)a.textContent="错题本（"+n+"）";
  if(b)b.textContent="错题本（"+n+"）";
}
function startWrongPractice(){
  var arr=wrongIndices();
  if(!arr.length){alert("错题本为空，请先完成答题并记录错题。");return;}
  deleteAnswersForIndices(arr);for(var z=0;z<arr.length;z++){delete state.sel[arr[z]];}
  trackEvent("wrongbook","practice_start","",arr.length);
  state.scope="wrong";
  state.wq=arr.slice();
  state.cur=0;
  state.type="all";
  state.mode="practice";
  setModeBtns("practice");
  render();
}
function wrongCardHtml(i,n,entry){
  var q=Q[i],h="";
  var ws=entry&&entry.sel?entry.sel:[];
  h+='<div class="q-card">';
  h+='<div class="q-head"><span class="q-no">错题 '+(n+1)+'.</span><span class="badge '+q.t+'">'+(q.t==="single"?"单选":"多选")+'</span><span class="q-doc">文件'+('0'+q.f).slice(-2)+' · '+esc(DOCS[q.f].replace(/^\d+\s*/,""))+'</span></div>';
  h+='<div class="q-text">'+esc(q.q)+'</div><div class="opts">';
  for(var j=0;j<q.o.length;j++){
    var L=letter(j),cls="opt locked";
    if(q.a.indexOf(L)>=0){cls+=" right";}else if(ws.indexOf(L)>=0){cls+=" wrong";}
    h+='<div class="'+cls+'"><span class="k">'+L+'.</span><span>'+esc(q.o[j])+'</span>'+(q.a.indexOf(L)>=0?'<span class="mark" style="color:var(--green)">&#10003;</span>':"")+'</div>';
  }
  h+='</div>';
  h+='<div class="reveal show review"><div><b>你的答案：</b>'+(ws.length?esc(ws.join("、")):"（未记录）")+'　<b>正确答案：</b><span class="ans">'+esc(q.a.split("").join("、"))+'</span></div>';
  h+='<div style="margin-top:4px"><b>解析：</b>'+esc(q.x)+'</div></div></div>';
  return h;
}
function renderWrongBook(){
  var ids=wrongIndices();
  var h='<div class="q-card wrong-panel"><div class="q-head"><span class="q-no">错题本</span><span class="badge m">共 '+ids.length+' 题</span></div>';
  h+="<p>答错的题会自动收录到这里；错题只存在本机浏览器中，刷新不丢失。用“只练错题”重做，答对后默认移出错题本；也可打印或下载当前全部错题（含你的答案、正确答案与解析）。</p>";
  h+='<div class="wrong-actions">';
  h+='<button class="primary" id="wbPractice">只练错题（'+ids.length+'）</button>';
  h+='<button id="wbPrint">打印错题</button>';
  h+='<button id="wbDownload">下载错题 HTML</button>';
  h+='<button class="danger" id="wbClear">清空错题本</button>';
  h+='</div></div>';
  if(!ids.length){
    h+='<div class="wrong-empty">当前还没有错题。逐题练习或整卷作答时，凡答错都会自动收进这里。</div>';
  }else{
    for(var n=0;n<ids.length;n++){
      var i=ids[n];
      h+=wrongCardHtml(i,n,state.store.wrongbook[wrongKey(i)]);
    }
  }
  var box=document.getElementById("quizBox");
  box.innerHTML=h;
  var bp=document.getElementById("wbPractice");
  if(bp)bp.addEventListener("click",startWrongPractice);
  var pr=document.getElementById("wbPrint");
  if(pr)pr.addEventListener("click",printWrongBook);
  var dl=document.getElementById("wbDownload");
  if(dl)dl.addEventListener("click",downloadWrongBook);
  var cl=document.getElementById("wbClear");
  if(cl)cl.addEventListener("click",function(){
    if(confirm("确定清空错题本吗？此操作不可恢复。")){
      clearWrong();
      if(state.mode==="wrongbook")render();
      else{state.mode="wrongbook";setModeBtns("wrongbook");render();}
    }
  });
}
function buildWrongExportHtml(){
  var ids=wrongIndices();
  var body="";
  for(var n=0;n<ids.length;n++){
    var i=ids[n],q=Q[i];
    var ws=state.store.wrongbook[wrongKey(i)]&&state.store.wrongbook[wrongKey(i)].sel?state.store.wrongbook[wrongKey(i)].sel:[];
    body+='<div class="card"><div class="head"><b>错题 '+(n+1)+'</b><span>'+DOCS[q.f].replace(/^\d+\s*/,"")+'</span><span>'+((q.t==="single")?"单选":"多选")+'</span></div>';
    body+='<div class="q">'+q.q+'</div><div class="opts">';
    for(var j=0;j<q.o.length;j++){
      var L=letter(j),flag="";
      if(q.a.indexOf(L)>=0){flag=" (正确答案)";}
      else if(ws.indexOf(L)>=0){flag=" (你的错误选择)";}
      body+='<div>'+L+'. '+q.o[j]+flag+'</div>';
    }
    body+='</div><div class="ans"><b>你的答案：</b>'+(ws.length?ws.join("、"):"未记录")+'　<b>正确答案：</b>'+q.a.split("").join("、")+'</div>';
    body+='<div class="ana"><b>解析：</b>'+q.x+'</div></div>';
  }
  var d=new Date();
  var stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  return "<!DOCTYPE html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><title>错题集</title>"+
    "<style>body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;margin:30px;color:#262B33;line-height:1.7}"+
    "h1{font-size:22px}.meta{color:#5B6472;font-size:13px;margin-bottom:16px}.card{border:1px solid #D9D2C4;border-radius:10px;padding:14px 18px;margin-bottom:14px;page-break-inside:avoid}"+
    ".head{display:flex;gap:12px;margin-bottom:6px;color:#23406B;font-size:14px}.q{font-weight:600;margin-bottom:6px}"+
    ".opts div{padding:2px 0}.ans{color:#1F4A34;font-weight:600;margin-top:4px}.ana{color:#5B6472;font-size:13px;margin-top:2px}"+
    "@media print{.card{break-inside:avoid}}</style></head><body><h1>心理健康工作政策文件题库 · 错题集（解析版）</h1>"+
    "<div class=\"meta\">生成日期："+stamp+"；共 "+ids.length+" 题。本题库依据相关心理健康政策文件整理，仅供备赛复习使用。</div>"+body+"</body></html>";
}
function printWrongBook(){
  var ids=wrongIndices();
  if(!ids.length){alert("错题本为空，没有可打印内容。");return;}
  trackEvent("wrongbook","export_print","",ids.length);
  var w=window.open("","_blank");
  if(!w){alert("浏览器拦截了弹出窗口，请允许后再试。");return;}
  w.document.write(buildWrongExportHtml());
  w.document.close();
  setTimeout(function(){w.focus();w.print();},400);
}
function downloadWrongBook(){
  var ids=wrongIndices();
  if(!ids.length){alert("错题本为空，没有可导出的内容。");return;}
  trackEvent("wrongbook","export_download","",ids.length);
  var blob=new Blob(["\ufeff"+buildWrongExportHtml()],{type:"text/html;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  var d=new Date();
  a.download="错题集_"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+".html";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function render(){if(state.mode==="exam"){exChrome(false);renderExam();updateWrongCounts();return;}exChrome(true);if(state.mode==="progress"){renderProgress();}
  else if(state.mode==="wrongbook"){renderWrongBook();}
  else if(state.mode==="practice"){renderPractice();}
  else{renderReview();}
  renderFilters();
  updateStats();
  updateWrongCounts();
  updateProgressBadge();
  renderResumeBanner();
}


function allFilesObj(){   var o={};   for(var k in DOCS){if(!isSim(k))o[k]=true;}   return o; }
function fileCounts(){
  var c={};
  for(var i=0;i<Q.length;i++){
    var f=Q[i].f;
    c[f]=(c[f]||0)+1;
  }
  return c;
}
function initFileSel(){
  if(!state.files){state.files=allFilesObj();}
  var list=document.getElementById("selList");
  list.innerHTML="";
  var counts=fileCounts();
  var keys=[];
  for(var k in DOCS){keys.push(k);}
  keys.sort(function(a,b){return parseInt(a,10)-parseInt(b,10);});
  var hdr1=document.createElement("div");
  hdr1.className="sel-group";
  hdr1.textContent="政策文件卷（1—15）";
  list.appendChild(hdr1);
  var hdr2Done=false;
for(var j=0;j<keys.length;j++){
    (function(f){
      if(isSim(f)&&!hdr2Done){
        hdr2Done=true;
        var hdr2=document.createElement("div");
        hdr2.className="sel-group";
        hdr2.textContent="模拟卷（每套 100 题）";
        list.appendChild(hdr2);
      }
      var lbl=document.createElement("label");
      var cb=document.createElement("input");
      cb.type="checkbox";cb.value=f;cb.className="sel-cb";
      cb.checked=!!state.files[f];
      var span=document.createElement("span");
      span.textContent=DOCS[f]+"（"+(counts[f]||0)+"题）";
      lbl.appendChild(cb);lbl.appendChild(span);
      list.appendChild(lbl);
      cb.addEventListener("change",function(){
        var nf={};
        for(var k in DOCS){if(k===f){if(cb.checked)nf[k]=true;}else if(state.files[k])nf[k]=true;}
        switchRange(nf,state.type);
      });
    })(keys[j]);
  }
  var box=document.getElementById("selBox");
  var btn=document.getElementById("selBtn");
  var panel=document.getElementById("selPanel");
  btn.addEventListener("click",function(e){
    e.stopPropagation();
    panel.classList.toggle("show");
  });
  document.addEventListener("click",function(e){
    if(box&&!box.contains(e.target)){panel.classList.remove("show");}
  });
  document.getElementById("selAll").addEventListener("click",function(){
    switchRange(allFilesObj(),state.type);
  });
  document.getElementById("selClear").addEventListener("click",function(){
    switchRange({},state.type);
  });
}
function updateSelChecks(){
  var cbs=document.querySelectorAll("#selList .sel-cb");
  for(var i=0;i<cbs.length;i++){
    cbs[i].checked=!!state.files[cbs[i].value];
  }
}
function renderFilters(){
  var counts=fileCounts();
  var sel=[];
  for(var k in DOCS){if(state.files[k])sel.push(k);}
  sel.sort(function(a,b){return parseInt(a,10)-parseInt(b,10);});
  var total=0;
  for(var i=0;i<sel.length;i++){total+=counts[sel[i]]||0;}
  var allKeys=Object.keys(DOCS).length;
  var btnText=document.getElementById("selBtnText");
  if(sel.length===allKeys){
    btnText.textContent="文件卷筛选：已选全部 "+allKeys+" 卷（"+total+"题）";
  }else{
    btnText.textContent="文件卷筛选：已选 "+sel.length+"/"+allKeys+" 卷（"+total+"题）";
  }
  var sum=document.getElementById("selSummary");
  if(sel.length===0){
    sum.textContent="当前未选择任何文件卷，无法出题；请在下拉框中至少勾选一卷。";
  }else if(sel.length===allKeys){
    sum.textContent="当前选择：全部 "+allKeys+" 卷，共 "+total+" 题。";
  }else{
    var parts=[];
    for(var j=0;j<sel.length;j++){
      parts.push(DOCS[sel[j]]+"（"+(counts[sel[j]]||0)+"题）");
    }
    sum.textContent="当前选择："+parts.join("、")+"。";
  }
  updateSelChecks();
  document.querySelectorAll(".type-seg button").forEach(function(b){
    b.classList.toggle("on",b.getAttribute("data-type")===state.type);
  });
  var hint=document.getElementById("hintLine");
  if(state.mode==="progress"){
    hint.textContent="学习进度：可继续任意一个文件卷范围，也可导出或导入学习记录。";
  }else if(state.mode==="practice"){
    hint.textContent="练习模式：先用文件卷下拉框勾选要练的卷（可多选），再选选项并点“提交答案”即时判分；可用上一题/下一题切换，仅统计当前范围的作答。";
  }else{
    hint.textContent="整卷浏览模式：直接显示正确答案与解析；文件卷筛选可多选，当前范围以筛选文字行为准。";
  }
}

function updateStats(){
  var ids=visibleIds();
  var done=ids.filter(isDone);
  var right=done.filter(function(i){return answerOf(i).ok;});
  document.getElementById("sDone").textContent=done.length;
  document.getElementById("sRight").textContent=right.length;
  document.getElementById("sWrong").textContent=done.length-right.length;
  document.getElementById("progBar").style.width=(ids.length?done.length/ids.length*100:0)+"%";
}
function showSummary(ids){
  trackEvent("quiz","range_complete","count="+ids.length,ids.length);
  var sum=document.getElementById("summary");
  var done=ids.filter(isDone);
  var right=done.filter(function(i){return answerOf(i).ok;});
  var wrong=done.filter(function(i){return !answerOf(i).ok;});
  var h="<h2>当前范围作答完成</h2>";
  h+='<div class="score-big">'+right.length+" / "+ids.length+"</div>";
  h+='<div class="stats"><div>正确率 <b>'+Math.round(right.length/ids.length*100)+"%</b></div>";
  h+="<div>答对 <b>"+right.length+"</b> 题</div><div>答错 <b>"+wrong.length+"</b> 题</div></div>";
  if(wrong.length){
    h+="<h3 style=\"margin-top:14px;color:var(--red);font-size:15px\">错题回顾（点击跳转）</h3><ul class=\"wrongList\">";
    for(var k=0;k<wrong.length;k++){
      var i=wrong[k];
      h+='<li data-i="'+i+'">第'+(ids.indexOf(i)+1)+'题（'+DOCS[Q[i].f].replace(/^\d+\s*/,"")+'）：'+esc(Q[i].q)+"</li>";
    }
    h+="</ul>";
  }
  h+='<div class="navBtns" style="margin-top:16px"><button id="btnAgain">再练一遍当前范围</button><button id="btnReviewAll">整卷浏览</button></div>';
  sum.innerHTML=h;sum.classList.add("show");
  sum.querySelectorAll(".wrongList li").forEach(function(li){
    li.addEventListener("click",function(){
      var i=parseInt(li.getAttribute("data-i"),10);
      state.files[Q[i].f]=true;
      state.files[Q[i].f]=true;
      state.rangeKey=rangeKey(state.files,state.type);
      var ids2=visibleIds();
      state.cur=ids2.indexOf(i);
      state.mode="practice";
      setModeBtns("practice");
      sum.classList.remove("show");
      saveRange(true);
      render();
    });
  });
  document.getElementById("btnAgain").addEventListener("click",function(){sum.classList.remove("show");showStartOverModal();});
  document.getElementById("btnReviewAll").addEventListener("click",function(){
    sum.classList.remove("show");state.mode="review";
    setModeBtns("review");
    render();
  });
  sum.scrollIntoView({behavior:"smooth",block:"start"});
}
function resetAll(){showClearProgressModal();}
function goPrint(){
  saveRange(true);state.mode="review";setModeBtns("review");render();window.print();
}
var mP=document.getElementById("mPractice"),mR=document.getElementById("mReview"),mW=document.getElementById("mWrong");
var mProgress=document.createElement("button");
mProgress.id="mProgress";mProgress.textContent="学习进度";
mW.parentNode.insertBefore(mProgress,mW.nextSibling);
function setModeBtns(m){
  mP.classList.toggle("on",m==="practice");
  mR.classList.toggle("on",m==="review");
  mW.classList.toggle("on",m==="wrongbook");
  mProgress.classList.toggle("on",m==="progress");
  if(window.mExam)window.mExam.classList.toggle("on",m==="exam");}
mP.addEventListener("click",function(){saveRange(true);state.mode="practice";state.scope="all";state.wq=null;setModeBtns("practice");render();});
mR.addEventListener("click",function(){saveRange(true);state.mode="review";state.scope="all";state.wq=null;setModeBtns("review");render();});
mW.addEventListener("click",function(){saveRange(true);state.mode="wrongbook";state.scope="all";state.wq=null;setModeBtns("wrongbook");render();trackEvent("wrongbook","open","",wrongIndices().length);});
mProgress.addEventListener("click",function(){saveRange(true);state.mode="progress";state.scope="all";state.wq=null;setModeBtns("progress");render();trackEvent("progress","open","",Object.keys(state.store.legacyRanges||{}).length);});
document.querySelectorAll(".type-seg button").forEach(function(b){
  b.addEventListener("click",function(){switchRange(state.files,b.getAttribute("data-type"));});
});
document.getElementById("btnReset").textContent="清除进度";
document.getElementById("btnReset").addEventListener("click",resetAll);
document.getElementById("btnPrint").addEventListener("click",goPrint);
window.addEventListener("beforeunload",function(){saveRange(true);persistNow();});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"){saveRange(true);persistNow();}});
window.addEventListener("storage",function(e){if(e.key===V2KEY){loadStore();render();}});
if(location.search.indexOf("print=1")>=0){state.mode="review";setModeBtns("review");}
loadStore();
restoreInitialSession();
initFileSel();
initProgressUI();
updateWrongCounts();
trackEvent("usage","page_load","",1);
render();

/* ================== 模拟考试模式 ================== */
var EXAM_KEYS=["16","17","18","19","20"],EXAM_MS=3600000;
var examTick=null,examWarn={},examFired=false;
function exLabel(k){return DOCS[k]||("模拟题"+k);}
function exIds(k){var o=[];for(var i=0;i<Q.length;i++){if(Q[i].f===k)o.push(i);}return o;}
function exStore(){var st=state.store;if(!st.exams)st.exams={};if(typeof st.exams.active==="undefined")st.exams.active=null;return st.exams;}
function exA(){var e=state.store&&state.store.exams;return e?e.active:null;}
function exSel(i){var a=exA();if(!a||!a.answers)return[];var e=a.answers[qidOf(i)];return e&&e.sel?e.sel.slice():[];}
function exSetSel(i,sel){var a=exA();if(!a)return;a.answers[qidOf(i)]={sel:sel.slice(),ts:now()};a.updatedAt=now();state.store.updatedAt=now();schedulePersist();}
function exAnswered(i){return exSel(i).length>0;}
function exStats(){var a=exA();if(!a)return{done:0,total:0};var ids=exIds(a.setKey),d=0;for(var i=0;i<ids.length;i++){if(exAnswered(ids[i]))d++;}return{done:d,total:ids.length};}
function exClock(ms){if(ms<0)ms=0;var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function exRemain(){var a=exA();return a?Math.max(0,a.deadline-Date.now()):0;}
function exStop(){if(examTick){clearInterval(examTick);examTick=null;}}
function exToast(msg){var d=document.createElement("div");d.className="exm-toast";d.textContent=msg;document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},2600);}
function exMask(html){exCloseMask();var m=document.createElement("div");m.className="exm-mask";m.innerHTML='<div class="exm-box">'+html+'</div>';document.body.appendChild(m);return m;}
function exCloseMask(){var a=document.querySelectorAll(".exm-mask");for(var i=0;i<a.length;i++){if(a[i].parentNode)a[i].parentNode.removeChild(a[i]);}}
function exChrome(on){var ids=["selBox","selSummary","hintLine","btnPrint","statbar"];for(var i=0;i<ids.length;i++){var e=document.getElementById(ids[i]);if(e)e.style.display=on?"":"none";}
  var sc=document.querySelectorAll(".statbar");for(var j=0;j<sc.length;j++)sc[j].style.display=on?"":"none";
  var t=document.querySelectorAll(".type-seg");for(var k=0;k<t.length;k++)t[k].style.display=on?"":"none";}
function exIdxById(ids,qid){for(var i=0;i<ids.length;i++){if(qidOf(ids[i])===qid)return i;}return 0;}
function exGo(pos){var a=exA();if(!a)return;var ids=exIds(a.setKey);if(pos<0||pos>=ids.length)return;a.currentQid=qidOf(ids[pos]);a.updatedAt=now();schedulePersist();renderExam();}
function exStart(setKey){var ids=exIds(setKey);if(!ids.length){alert("该模拟卷暂无题目。");return;}
  var es=exStore();
  es.active={setKey:setKey,startedAt:now(),deadline:now()+EXAM_MS,answers:{},currentQid:qidOf(ids[0]),updatedAt:now(),done:false,submittedAt:0};
  state.mode="exam";examWarn={};examFired=false;
  setModeBtns("exam");
  persistNow();render();}
function exAbandon(){var es=exStore();es.active=null;examWarn={};examFired=false;exStop();persistNow();render();}
function exSubmit(){var a=exA();if(!a||a.done)return;
  var ids=exIds(a.setKey);
  for(var k=0;k<ids.length;k++){var i=ids[k];var sel=exSel(i);if(!sel.length)continue;
    if(normAns(sel.join(""))===normAns(Q[i].a)){if(isWrong(i))removeWrong(i);}
    else{addWrong(i,sel);}}
  a.done=true;a.submittedAt=now();a.updatedAt=now();
  exStop();persistNow();render();}
function exStartTimer(){exStop();
  examTick=setInterval(function(){
    var a=exA();if(!a||a.done||state.mode!=="exam"){exStop();return;}
    var r=exRemain();var el=document.getElementById("examClock");
    if(el){el.textContent=exClock(r);el.className="exclock"+(r<=60000?" danger":(r<=300000?" warn":""));}
    if(r>0){var mn=Math.ceil(r/60000);if((mn===10||mn===5||mn===1)&&!examWarn[mn]){examWarn[mn]=1;exToast("剩余 "+mn+" 分钟");}}
    else if(!examFired){examFired=true;exStop();exToast("时间到，已自动交卷");exSubmit();}
  },1000);}
function renderExam(){var a=exA();
  if(!a){renderExamPick();return;}
  if(a.done){renderExamResult(a);return;}
  if(Date.now()>=a.deadline){exSubmit();return;}
  renderExamQuestion(a);exStartTimer();}
function renderExamPick(){
  var h='<div class="q-card"><div class="q-head"><span class="q-no">模拟考试</span></div>';
  h+='<p style="margin-top:8px;font-size:13.5px;color:var(--sub);line-height:1.8">每套 100 题，限时 60 分钟。考试过程中不显示对错与解析；交卷后统一评分并逐题回顾。考试答案单独保存，不计入练习进度；答错的题会自动加入错题本。</p></div>';
  h+='<div class="exam-pick">';
  var cnt=fileCounts();
  for(var k=0;k<EXAM_KEYS.length;k++){var key=EXAM_KEYS[k];
    h+='<button data-set="'+key+'"><b>'+esc(exLabel(key))+'</b><span>共 '+(cnt[key]||0)+' 题 · 限时 60 分钟</span></button>';}
  h+='</div>';
  quizBox.innerHTML=h;
  var bs=quizBox.querySelectorAll(".exam-pick button");
  for(var j=0;j<bs.length;j++){bs[j].addEventListener("click",(function(b){return function(){exStart(b.getAttribute("data-set"));};})(bs[j]));}}
function renderExamQuestion(a){
  var ids=exIds(a.setKey);var p=exIdxById(ids,a.currentQid);var i=ids[p];var q=Q[i];var sel=exSel(i);
  var st=exStats();
  var h='<div class="exam-bar"><span class="exname">'+esc(exLabel(a.setKey))+'</span><span class="exdone">已答 '+st.done+' / '+st.total+'</span><span class="exclock" id="examClock">'+exClock(exRemain())+'</span></div>';
  h+='<div class="q-card"><div class="q-head"><span class="q-no">第 '+(p+1)+' 题 / 共 '+ids.length+' 题</span><span class="badge '+q.t+'">'+(q.t==="single"?"单选":"多选")+'</span></div>';
  h+='<div class="q-text">'+esc(q.q)+'</div><div class="opts">';
  for(var k=0;k<q.o.length;k++){var L=String.fromCharCode(65+k);
    h+='<div class="opt'+(sel.indexOf(L)>=0?" sel":"")+'" data-k="'+L+'"><b>'+L+'</b><span>'+esc(q.o[k])+'</span></div>';}
  h+='</div></div>';
  h+='<div class="exam-nav"><button id="exPrev"'+(p===0?" disabled":"")+'>上一题</button><button id="exCard">答题卡</button><button id="exSubmit" class="primary">交卷</button><button id="exNext"'+(p===ids.length-1?" disabled":"")+'>下一题</button></div>';
  quizBox.innerHTML=h;
  var opts=quizBox.querySelectorAll(".opt");
  for(var m=0;m<opts.length;m++){opts[m].addEventListener("click",(function(o){return function(){
    var L=o.getAttribute("data-k");var cur=exSel(i);
    if(q.t==="single"){cur=[L];}else{var ix=cur.indexOf(L);if(ix>=0)cur.splice(ix,1);else cur.push(L);cur.sort();}
    exSetSel(i,cur);renderExamQuestion(a);};})(opts[m]));}
  var bp=document.getElementById("exPrev");if(bp)bp.onclick=function(){exGo(p-1);};
  var bn=document.getElementById("exNext");if(bn)bn.onclick=function(){exGo(p+1);};
  var bc=document.getElementById("exCard");if(bc)bc.onclick=function(){exCardView(ids,p);};
  var bs2=document.getElementById("exSubmit");if(bs2)bs2.onclick=function(){exConfirmSubmit();};}
function exCardView(ids,curPos){
  var nMulti=0;for(var q0=0;q0<ids.length;q0++){if(Q[ids[q0]].t==="multi")nMulti++;}
  var h='<h3>答题卡</h3><p>已答 '+exStats().done+' 题；共 '+ids.length+' 题，其中多选 '+nMulti+' 题。点击题号可跳题。</p>';
  h+='<div class="exm-legend"><span><i class="done"></i>已答</span><span><i></i>未答</span><span><i class="multi"></i>多选题（须选全部正确项才得分）</span></div>';
  h+='<div class="exm-grid">';
  for(var k=0;k<ids.length;k++){var done=exAnswered(ids[k]);var isM=Q[ids[k]].t==="multi";
    h+='<button class="exm-cell'+(isM?" multi":"")+(done?" done":"")+(k===curPos?" cur":"")+'" data-p="'+k+'" title="第'+(k+1)+'题'+(isM?"（多选）":"（单选）")+'">'+(k+1)+'</button>';}
  h+='</div><div class="exm-acts"><button id="exmClose">关闭</button></div>';
  var m=exMask(h);
  document.getElementById("exmClose").onclick=function(){exCloseMask();};
  var cs=m.querySelectorAll(".exm-cell");
  for(var j=0;j<cs.length;j++){cs[j].onclick=function(){var p=parseInt(this.getAttribute("data-p"),10);exCloseMask();exGo(p);};}}
function exConfirmSubmit(){
  var st=exStats();var blank=st.total-st.done;
  exMask('<h3>确定交卷？</h3><p>已答 <b>'+st.done+'</b> 题，未答 <b>'+blank+'</b> 题。交卷后不能再修改答案。</p><div class="exm-acts"><button id="exmCancel">继续答题</button><button id="exmOk" class="primary">确认交卷</button></div>');
  document.getElementById("exmCancel").onclick=function(){exCloseMask();};
  document.getElementById("exmOk").onclick=function(){exCloseMask();exSubmit();};}
function exOptsReview(q,sel){
  var h='<div class="opts">';var ans=q.a.split("");
  for(var k=0;k<q.o.length;k++){var L=String.fromCharCode(65+k);var cls="opt locked";
    if(ans.indexOf(L)>=0)cls+=" right";
    if(sel.indexOf(L)>=0)cls+=" sel";
    h+='<div class="'+cls+'"><b>'+L+'</b><span>'+esc(q.o[k])+'</span></div>';}
  return h+'</div>';}
function renderExamResult(a){
  var ids=exIds(a.setKey);var right=0,wrong=0,blank=0,rows='';
  for(var k=0;k<ids.length;k++){var i=ids[k];var q=Q[i];var sel=exSel(i);
    var ok=sel.length>0&&normAns(sel.join(""))===normAns(q.a);
    if(!sel.length)blank++;else if(ok)right++;else wrong++;
    var cls=!sel.length?"":(ok?"correct":"incorrect");
    rows+='<div class="q-card" style="margin-top:10px"><div class="q-head"><span class="q-no">第'+(k+1)+'题</span><span class="badge '+q.t+'">'+(q.t==="single"?"单选":"多选")+'</span><span class="q-doc">文件'+('0'+q.f).slice(-2)+' · '+esc(DOCS[q.f].replace(/^\d+\s*/,""))+'</span></div>';
    rows+='<div class="q-text">'+esc(q.q)+'</div>'+exOptsReview(q,sel);
    rows+='<div class="reveal show '+cls+'"><b>'+(sel.length?(ok?"回答正确":"回答错误"):"未作答")+'</b>　正确答案：<span class="ans">'+esc(q.a.split("").join("、"))+'</span>'+(sel.length?'　你的答案：'+esc(sel.join("、")):'')+'<div style="margin-top:4px"><b>解析：</b>'+esc(q.x)+'</div></div></div>';}
  var used=Math.max(0,Math.round(((a.submittedAt||now())-a.startedAt)/1000));
  var um=Math.floor(used/60),us=used%60;
  var h='<div class="q-card"><div class="q-head"><span class="q-no">'+esc(exLabel(a.setKey))+' · 成绩</span></div>';
  h+='<div class="exm-score"><b>'+right+'</b><span>/ 100 分</span></div>';
  h+='<div class="exm-kpis"><span>答对 <b>'+right+'</b></span><span>答错 <b>'+wrong+'</b></span><span>未答 <b>'+blank+'</b></span><span>正确率 <b>'+Math.round(right/ids.length*100)+'%</b></span><span>用时 <b>'+um+' 分 '+us+' 秒</b></span></div>';
  h+='<p style="margin-top:12px;font-size:13px;color:var(--sub);line-height:1.8">答错的题已自动加入错题本，可到“错题本”里重练。实际考试为 60 分钟 100 题，可对照上面的用时了解自己的答题速度。</p>';
  h+='<div class="exam-nav"><button id="exAgain" class="primary">再做一套</button><button id="exBack">返回练习</button></div></div>';
  h+='<h3 style="margin:18px 0 4px;font-size:15px">逐题回顾</h3>';
  quizBox.innerHTML=h+rows;
  document.getElementById("exAgain").onclick=function(){exAbandon();};
  document.getElementById("exBack").onclick=function(){exAbandon();};}
function exResume(){
  var mExam=document.getElementById("mExam");
  if(!mExam){mExam=document.createElement("button");mExam.id="mExam";mExam.textContent="模拟考试";
    var ref=document.getElementById("mProgress")||document.getElementById("mWrong");
    ref.parentNode.insertBefore(mExam,ref.nextSibling);}
  window.mExam=mExam;
  mExam.onclick=function(){saveRange(true);state.mode="exam";state.scope="all";state.wq=null;setModeBtns("exam");exStop();render();};
  var a=exA();
  if(!a)return;
  if(a.done){state.mode="exam";setModeBtns("exam");render();return;}
  if(Date.now()>=a.deadline){state.mode="exam";setModeBtns("exam");exSubmit();return;}
  exMask('<h3>发现未完成的模拟考试</h3><p>'+esc(exLabel(a.setKey))+'，剩余时间 <b>'+exClock(exRemain())+'</b>，已答 '+exStats().done+' 题。是否继续？</p><div class="exm-acts"><button id="exmGive">放弃本次</button><button id="exmGo" class="primary">继续考试</button></div>');
  document.getElementById("exmGo").onclick=function(){exCloseMask();state.mode="exam";setModeBtns("exam");render();};
  document.getElementById("exmGive").onclick=function(){exCloseMask();exAbandon();};}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){setTimeout(exResume,0);});}else{setTimeout(exResume,0);}

})();

</script>
